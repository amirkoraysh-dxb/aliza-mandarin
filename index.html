<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandarin Playroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#F0F7FF;
    --surface:#FFFFFF;
    --ink:#1F2A44;
    --ink-soft:#5B6889;
    --coral:#FF6B5B;
    --sun:#FFC145;
    --bamboo:#2FBF8F;
    --sky:#4C8DFF;
    --purple:#A78BFA;
    --gold:#E8A317;
    --teal:#0EA5A5;
    --shadow: 31,42,68;
    --card-back-a:#DCEBFF;
    --card-back-b:#C7DEFF;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0F1830;
      --surface:#182448;
      --ink:#EEF3FF;
      --ink-soft:#9FAFD4;
      --coral:#FF8A7C;
      --sun:#FFD873;
      --bamboo:#4CE0B3;
      --sky:#7AAEFF;
      --purple:#C6B7FF;
      --gold:#FFCB66;
      --teal:#4DD9D9;
      --shadow: 3,6,16;
      --card-back-a:#233363;
      --card-back-b:#1B2850;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F1830;
    --surface:#182448;
    --ink:#EEF3FF;
    --ink-soft:#9FAFD4;
    --coral:#FF8A7C;
    --sun:#FFD873;
    --bamboo:#4CE0B3;
    --sky:#7AAEFF;
    --purple:#C6B7FF;
    --gold:#FFCB66;
    --teal:#4DD9D9;
    --shadow: 3,6,16;
    --card-back-a:#233363;
    --card-back-b:#1B2850;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Quicksand', system-ui, sans-serif;
    padding:20px 16px 48px;
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
  }
  h1,h2,h3{ font-family:'Baloo 2', 'Quicksand', system-ui, sans-serif; text-wrap:balance; margin:0; }
  .hanzi{ font-family:'Noto Sans SC','Baloo 2',sans-serif; }
  button{ font-family:inherit; color:inherit; }
  a{ color:inherit; }
  .swatch{
    border:3px solid rgba(120,130,150,.28);
    display:inline-flex; align-items:center; justify-content:center; line-height:1;
  }

  .wrap{ max-width:900px; margin:0 auto; }

  /* ---------- header ---------- */
  .top{
    display:flex; align-items:center; gap:14px; margin-bottom:22px; flex-wrap:wrap;
  }
  .panda{ width:56px; height:56px; flex:none; filter: drop-shadow(0 3px 6px rgba(var(--shadow),0.15)); }
  .top h1{ font-size:clamp(24px,5vw,32px); color:var(--ink); }
  .top .tag{ color:var(--ink-soft); font-size:15px; font-weight:600; margin-top:2px; }
  .top-spacer{ flex:1; }
  .back-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--surface); color:var(--ink); border:none;
    padding:10px 16px; border-radius:999px; font-weight:700; font-size:15px;
    cursor:pointer; box-shadow:0 4px 0 rgba(var(--shadow),0.1);
    transition:transform .12s ease;
  }
  .back-btn:hover{ transform:translateY(-1px); }
  .back-btn:active{ transform:translateY(1px); }
  .back-btn:focus-visible, button:focus-visible, [tabindex]:focus-visible{
    outline:3px solid var(--sky); outline-offset:2px;
  }

  /* ---------- home: subject tiles ---------- */
  .tiles{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:18px; margin-bottom:20px;
  }
  .tile{
    --accent: var(--sky);
    background:var(--surface);
    border-radius:28px;
    padding:22px 20px 20px;
    text-align:left;
    border:none;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    box-shadow:0 10px 0 rgba(var(--shadow),0.08), 0 2px 14px rgba(var(--shadow),0.10);
    transition:transform .15s ease, box-shadow .15s ease;
    display:flex; flex-direction:column; gap:10px;
    color:var(--ink);
  }
  .tile:hover{ transform:translateY(-4px); }
  .tile:active{ transform:translateY(1px); box-shadow:0 4px 0 rgba(var(--shadow),0.08); }
  .tile::before{
    content:""; position:absolute; inset:0 auto auto 0; width:100%; height:8px;
    background:var(--accent);
  }
  .tile .icon{
    font-size:38px; width:64px; height:64px; border-radius:20px;
    background:color-mix(in srgb, var(--accent) 18%, transparent);
    display:flex; align-items:center; justify-content:center;
  }
  .tile h2{ font-size:21px; }
  .tile .preview{ font-size:22px; letter-spacing:2px; opacity:.9; min-height:28px; }
  .tile .stars{ margin-top:auto; font-size:16px; letter-spacing:2px; }

  .intro-line{ color:var(--ink-soft); font-size:16px; font-weight:600; margin:2px 0 20px; }

  /* ---------- sound sort banner (home) ---------- */
  .sound-sort-banner{
    display:flex; align-items:center; gap:16px; width:100%; text-align:left; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--purple), color-mix(in srgb, var(--purple) 65%, #000 14%));
    color:#fff; border-radius:24px; padding:20px 22px; margin-bottom:22px;
    box-shadow:0 8px 0 color-mix(in srgb, var(--purple) 55%, #000 25%);
    transition:transform .12s ease;
  }
  .sound-sort-banner:hover{ transform:translateY(-2px); }
  .sound-sort-banner:active{ transform:translateY(2px); }
  .sound-sort-banner .ss-icon{ font-size:38px; flex:none; }
  .sound-sort-banner .ss-title{ font-family:'Baloo 2',sans-serif; font-size:20px; font-weight:800; }
  .sound-sort-banner .ss-desc{ font-size:14px; opacity:.92; font-weight:600; }

  /* ---------- songs banner (home) + song list + song detail ---------- */
  .songs-banner{
    display:flex; align-items:center; gap:16px; width:100%; text-align:left; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--coral), color-mix(in srgb, var(--coral) 65%, #000 14%));
    color:#fff; border-radius:24px; padding:20px 22px; margin-bottom:22px;
    box-shadow:0 8px 0 color-mix(in srgb, var(--coral) 55%, #000 25%);
    transition:transform .12s ease;
  }
  .songs-banner:hover{ transform:translateY(-2px); }
  .songs-banner:active{ transform:translateY(2px); }
  .songs-banner .ss-icon{ font-size:38px; flex:none; }
  .songs-banner .ss-title{ font-family:'Baloo 2',sans-serif; font-size:20px; font-weight:800; }
  .songs-banner .ss-desc{ font-size:14px; opacity:.92; font-weight:600; }

  .song-tile{
    --accent: var(--coral);
    background:var(--surface); border-radius:24px; padding:20px 18px; text-align:left; border:none; cursor:pointer;
    box-shadow:0 8px 0 rgba(var(--shadow),0.08), 0 2px 14px rgba(var(--shadow),0.10);
    display:flex; align-items:center; gap:14px; width:100%; margin-bottom:14px; color:var(--ink);
    transition:transform .12s ease;
  }
  .song-tile:hover{ transform:translateY(-2px); }
  .song-tile .icon{
    font-size:32px; width:52px; height:52px; border-radius:16px; flex:none;
    background:color-mix(in srgb, var(--accent) 18%, transparent);
    display:flex; align-items:center; justify-content:center;
  }
  .song-tile .song-title{ font-weight:800; font-size:17px; }
  .song-tile .song-hanzi{ color:var(--ink-soft); font-weight:700; font-size:14px; margin-top:2px; }

  .song-line{
    background:var(--surface); border-radius:22px; padding:20px 18px; margin-bottom:14px; cursor:pointer; border:none;
    width:100%; text-align:center; box-shadow:0 3px 12px rgba(var(--shadow),0.08); color:var(--ink);
  }
  .song-line .hanzi{ font-size:28px; font-weight:700; line-height:1.5; }
  .song-line .pinyin{ font-size:15px; color:var(--ink-soft); font-weight:700; margin-top:6px; }
  .song-line .en{ font-size:14px; color:var(--ink-soft); margin-top:6px; }
  .sing-all-btn{
    border:none; border-radius:999px; padding:14px 24px; font-weight:800; font-size:16px; cursor:pointer;
    background:var(--coral); color:#fff; box-shadow:0 5px 0 color-mix(in srgb, var(--coral) 55%, #000 25%);
    margin-bottom:20px; font-family:'Baloo 2',sans-serif;
  }

  /* ---------- difficulty settings ---------- */
  .settings-panel{
    display:flex; gap:16px; flex-wrap:wrap; align-items:center;
    background:var(--surface); border-radius:16px; padding:12px 18px; margin:0 0 22px;
    box-shadow:0 3px 10px rgba(var(--shadow),0.08);
  }
  .settings-panel .set-label{ font-weight:800; color:var(--ink-soft); font-size:14px; }
  .settings-panel label{ display:inline-flex; align-items:center; gap:7px; font-weight:700; font-size:14px; cursor:pointer; }
  .settings-panel input[type="checkbox"]{ width:19px; height:19px; accent-color:var(--sky); cursor:pointer; }
  .fallback-label{
    font-family:'Quicksand', sans-serif; font-weight:800; color:var(--ink);
    text-align:center; line-height:1.15; padding:4px; overflow-wrap:break-word;
    font-size:clamp(12px,3.4vw,16px);
  }

  /* ---------- subject hub ---------- */
  .subject-head{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .subject-head .icon-badge{
    --accent: var(--sky);
    width:52px; height:52px; border-radius:16px; font-size:28px;
    background:color-mix(in srgb, var(--accent) 20%, transparent);
    display:flex; align-items:center; justify-content:center;
  }
  .subject-head h2{ font-size:26px; }

  .word-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; margin-bottom:24px;
  }
  .word-card{
    background:var(--surface); border-radius:20px; padding:14px 10px 12px; text-align:center;
    border:none; cursor:pointer; box-shadow:0 3px 10px rgba(var(--shadow),0.08);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    transition:transform .12s ease; color:var(--ink);
  }
  .word-card:hover{ transform:translateY(-2px); }
  .word-card:active{ transform:scale(.97); }
  .word-card .visual{ font-size:34px; line-height:1; margin-bottom:2px; }
  .word-card .swatch{ width:38px; height:38px; border-radius:50%; margin-bottom:2px; box-shadow: inset 0 -4px 8px rgba(0,0,0,.12); font-size:19px; }
  .word-card .visual-img{ width:34px; height:54px; margin-bottom:2px; }
  .word-card .hanzi{ font-size:22px; font-weight:700; }
  .word-card .pinyin{ font-size:13px; color:var(--ink-soft); font-weight:600; }
  .word-card .en{ font-size:12px; color:var(--ink-soft); }
  .word-card .speak-note{ font-size:16px; margin-top:2px; }

  .mode-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px; }
  .mode-btn{
    --accent: var(--coral);
    border:none; border-radius:24px; cursor:pointer; text-align:left;
    padding:20px 22px; color:#fff;
    background:linear-gradient(160deg, var(--accent), color-mix(in srgb, var(--accent) 65%, #000 12%));
    box-shadow:0 10px 0 color-mix(in srgb, var(--accent) 55%, #000 25%);
    display:flex; flex-direction:column; gap:6px;
    transition:transform .12s ease;
  }
  .mode-btn:hover{ transform:translateY(-3px); }
  .mode-btn:active{ transform:translateY(2px); box-shadow:0 5px 0 color-mix(in srgb, var(--accent) 55%, #000 25%); }
  .mode-btn .emo{ font-size:32px; }
  .mode-btn .title{ font-size:20px; font-weight:800; font-family:'Baloo 2',sans-serif; }
  .mode-btn .desc{ font-size:14px; opacity:.92; font-weight:600; }

  /* ---------- shared: progress dots + prompt card + choices ---------- */
  .progress-dots{ display:flex; gap:8px; margin:6px 0 20px; flex-wrap:wrap; }
  .progress-dots .dot{ width:14px; height:14px; border-radius:50%; background:color-mix(in srgb, var(--ink-soft) 30%, transparent); }
  .progress-dots .dot.done{ background:var(--bamboo); }
  .progress-dots .dot.current{ outline:3px solid var(--sky); outline-offset:2px; }

  .prompt-card{
    background:var(--surface); border-radius:28px; padding:34px 20px; text-align:center; margin-bottom:26px;
    box-shadow:0 3px 16px rgba(var(--shadow),0.10);
    cursor:pointer; border:none; width:100%; color:var(--ink);
  }
  .prompt-card .hanzi{ font-size:64px; font-weight:700; line-height:1; }
  .prompt-card .pinyin{ font-size:22px; color:var(--ink-soft); font-weight:700; margin-top:6px; }
  .prompt-card .tap-hint{ font-size:14px; color:var(--ink-soft); margin-top:10px; font-weight:600; }
  .blank-mark{ display:inline-block; min-width:64px; border-bottom:4px solid var(--ink-soft); margin:0 6px; }

  .choice-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:16px; }
  .choice-tile{
    background:var(--surface); border:4px solid transparent; border-radius:22px; padding:20px 10px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 3px 10px rgba(var(--shadow),0.08);
    transition:transform .1s ease, border-color .15s ease;
    aspect-ratio:1/1; color:var(--ink);
  }
  .choice-tile .visual{ font-size:44px; }
  .choice-tile .swatch{ width:48px; height:48px; border-radius:50%; box-shadow: inset 0 -5px 10px rgba(0,0,0,.14); font-size:24px; }
  .choice-tile .visual-img{ width:44px; height:70px; }
  .choice-tile:hover{ transform:translateY(-2px); }
  .choice-tile.correct{ border-color:var(--bamboo); animation: pop .5s ease; }
  .choice-tile.wrong{ animation: shake .4s ease; border-color:var(--coral); }

  @keyframes pop{ 0%{transform:scale(1);} 40%{transform:scale(1.12);} 100%{transform:scale(1);} }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }

  /* ---------- memory game ---------- */
  .memory-grid{ display:grid; gap:12px; grid-template-columns:repeat(var(--cols,4), 1fr); }
  .flip-card{ perspective:800px; aspect-ratio:1/1; }
  .flip-card button{
    width:100%; height:100%; border:none; background:none; cursor:pointer; padding:0;
    position:relative; transform-style:preserve-3d; transition:transform .45s cubic-bezier(.2,.9,.3,1.1);
  }
  .flip-card.is-open button, .flip-card.is-matched button{ transform:rotateY(180deg); }
  .flip-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:16px;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:2px;
    box-shadow:0 3px 10px rgba(var(--shadow),0.10);
  }
  .flip-front{
    background:repeating-linear-gradient(135deg, var(--card-back-a) 0 14px, var(--card-back-b) 14px 28px);
    font-size:26px;
  }
  .flip-back{ background:var(--surface); transform:rotateY(180deg); padding:6px; text-align:center; color:var(--ink); }
  .flip-back .visual{ font-size:clamp(22px,6vw,36px); }
  .flip-back .swatch{ width:60%; aspect-ratio:1/1; border-radius:50%; box-shadow: inset 0 -5px 10px rgba(0,0,0,.14); font-size:clamp(14px,5vw,22px); }
  .flip-back .visual-img{ width:48%; height:64%; }
  .flip-back .hanzi{ font-size:clamp(16px,4vw,24px); font-weight:700; }
  .flip-back .pinyin{ font-size:clamp(9px,2.4vw,12px); color:var(--ink-soft); font-weight:700; }
  .flip-back .fallback-label{ font-size:clamp(10px,2.8vw,14px); padding:2px; }
  .flip-card.is-matched .flip-back{ background:color-mix(in srgb, var(--bamboo) 22%, var(--surface)); }

  /* ---------- shared image chip ---------- */
  .visual-img{ display:inline-flex; align-items:flex-end; justify-content:center; }
  .visual-img img{ width:100%; height:100%; object-fit:contain; display:block; }

  .stat-row{ display:flex; gap:18px; margin-bottom:18px; flex-wrap:wrap; font-weight:700; color:var(--ink-soft); }
  .stat-row b{ color:var(--ink); }

  /* ---------- sentence builder ---------- */
  .sentence-prompt{
    background:var(--surface); border-radius:28px; padding:26px 20px; text-align:center; margin-bottom:22px;
    box-shadow:0 3px 16px rgba(var(--shadow),0.10);
  }
  .sentence-prompt .sent-visual{ margin-bottom:10px; display:flex; justify-content:center; }
  .sentence-prompt .sent-visual .visual-img{ width:64px; height:96px; }
  .sentence-prompt .sent-visual .visual{ font-size:56px; }
  .sentence-prompt .sent-visual .swatch{ width:64px; height:64px; font-size:30px; }
  .hear-btn{
    border:none; background:color-mix(in srgb, var(--sky) 16%, transparent); color:var(--ink);
    font-weight:800; border-radius:999px; padding:10px 20px; cursor:pointer; font-size:15px;
  }
  .assembly-row{ display:flex; gap:12px; justify-content:center; margin:18px 0; flex-wrap:wrap; }
  .assembly-slot{
    min-width:110px; min-height:56px; border-radius:16px;
    border:3px dashed color-mix(in srgb, var(--ink-soft) 45%, transparent);
    display:flex; align-items:center; justify-content:center; padding:8px 14px;
    font-weight:700; font-size:19px; color:var(--ink-soft);
    background:color-mix(in srgb, var(--surface) 60%, transparent); cursor:pointer;
  }
  .assembly-slot.filled{ border-style:solid; border-color:var(--sky); background:var(--surface); color:var(--ink); }
  .assembly-slot.wrong{ animation:shake .4s ease; border-color:var(--coral); }
  .assembly-slot.correct{ border-color:var(--bamboo); animation:pop .5s ease; }
  .tile-bank{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:8px; }
  .word-tile{
    border:none; border-radius:16px; padding:14px 20px; font-weight:800; font-size:19px; cursor:pointer;
    background:var(--surface); box-shadow:0 4px 0 rgba(var(--shadow),0.1); color:var(--ink);
    transition:transform .1s ease;
  }
  .word-tile:active{ transform:translateY(2px); }
  .word-tile.used{ visibility:hidden; }
  .sentence-caption{ text-align:center; color:var(--ink-soft); font-weight:700; margin-top:10px; min-height:20px; }

  /* ---------- picture bingo ---------- */
  .bingo-call-row{ display:flex; align-items:center; gap:14px; justify-content:space-between; margin-bottom:8px; flex-wrap:wrap; }
  .repeat-btn{
    border:none; background:var(--surface); color:var(--ink); font-weight:800; border-radius:999px;
    padding:10px 20px; cursor:pointer; box-shadow:0 4px 0 rgba(var(--shadow),0.1);
  }
  .bingo-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:14px; margin-top:6px; }
  .bingo-tile{
    background:var(--surface); border-radius:18px; padding:10px 6px; border:4px solid transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center; aspect-ratio:1/1;
    box-shadow:0 3px 10px rgba(var(--shadow),0.08); transition:transform .1s ease; color:var(--ink);
  }
  .bingo-tile .visual-img{ width:56px; height:82px; }
  .bingo-tile .visual{ font-size:clamp(34px,9vw,54px); }
  .bingo-tile .swatch{ width:56px; height:56px; font-size:28px; }
  .bingo-tile:hover{ transform:translateY(-2px); }
  .bingo-tile.marked{ border-color:var(--bamboo); background:color-mix(in srgb, var(--bamboo) 18%, var(--surface)); cursor:default; }
  .bingo-tile.wrong{ animation:shake .4s ease; border-color:var(--coral); }


  /* ---------- write it (tracing) ---------- */
  .level-chips{ display:flex; gap:10px; flex-wrap:wrap; margin:0 0 16px; }
  .level-chip{
    border:3px solid transparent; border-radius:999px; padding:9px 16px; font-weight:800; font-size:14px; cursor:pointer;
    background:var(--surface); color:var(--ink); box-shadow:0 3px 10px rgba(var(--shadow),0.08);
  }
  .level-chip.selected{ border-color:var(--gold); background:color-mix(in srgb, var(--gold) 20%, var(--surface)); }
  .level-chip.locked{ opacity:.6; }
  .level-chip.wrong{ animation:shake .4s ease; }
  .write-layout{ display:grid; grid-template-columns:minmax(150px,210px) minmax(0,1fr); gap:18px; align-items:start; }
  .write-info{
    background:var(--surface); border-radius:24px; padding:18px 12px; text-align:center; color:var(--ink);
    box-shadow:0 3px 16px rgba(var(--shadow),0.10);
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .write-info .visual{ font-size:72px; line-height:1; }
  .write-info .swatch{ width:84px; height:84px; border-radius:50%; font-size:40px; box-shadow: inset 0 -5px 10px rgba(0,0,0,.14); }
  .write-info .visual-img{ width:90px; height:130px; }
  .write-info .w-pinyin{ font-size:22px; font-weight:800; color:var(--ink); }
  .write-info .w-en{ font-size:16px; font-weight:700; color:var(--ink-soft); }
  .pad-wrap{
    position:relative; width:100%; background:var(--surface); color:var(--ink);
    border:4px dashed color-mix(in srgb, var(--ink-soft) 40%, transparent); border-radius:24px; overflow:hidden;
    box-shadow:0 3px 16px rgba(var(--shadow),0.10);
  }
  .pad-wrap.done{ border-style:solid; border-color:var(--bamboo); animation:pop .5s ease; }
  .pad-wrap canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  #writeInk{ touch-action:none; cursor:crosshair; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .write-meter{ height:14px; border-radius:999px; background:color-mix(in srgb, var(--ink-soft) 25%, transparent); overflow:hidden; margin:14px 0 6px; }
  .write-meter > div{ height:100%; width:0; background:var(--bamboo); border-radius:999px; transition:width .25s ease; }

  /* ============ small helpers ============ */
  function $(sel, root){ return (root||document).querySelector(sel); }
  function $all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
  function shuffle(arr){
    var a = arr.slice();
    for (var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ---- short feedback chimes (synthesized, no audio files needed) ---- */
  var audioCtx = null;
  function getAudioCtx(){
    try{
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }catch(e){ return null; }
  }
  function tone(ctx, freq, startTime, duration, gainPeak){
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(gainPeak || 0.22, startTime + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.02);
  }
  function playCorrectSound(){
    var ctx = getAudioCtx(); if (!ctx) return;
    try{
      var t = ctx.currentTime;
      tone(ctx, 523.25, t, 0.14);        // C5
      tone(ctx, 783.99, t + 0.11, 0.20); // G5 — a bright little "ta-da"
    }catch(e){ /* ignore */ }
  }
  function playWrongSound(){
    var ctx = getAudioCtx(); if (!ctx) return;
    try{
      var t = ctx.currentTime;
      tone(ctx, 233, t, 0.16, 0.18);      // low, gentle "try again" buzz
      tone(ctx, 196, t + 0.09, 0.22, 0.16);
    }catch(e){ /* ignore */ }
  }

  function speak(text, lang){
    try{
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = 0.9;
      window.speechSynthesis.speak(u);
    }catch(e){ /* speech not available — fail silently */ }
  }
  function findSubject(id){
    for (var i=0;i<SUBJECTS.length;i++) if (SUBJECTS[i].id === id) return SUBJECTS[i];
    return null;
  }
  function sentenceZh(subject, word){ return subject.sentence.zhPrefix + word.hanzi + subject.sentence.zhSuffix; }
  function sentenceEn(subject, word){ return subject.sentence.enPrefix + word.en.toLowerCase() + subject.sentence.enSuffix; }

  /* Picture for a word: a real image file, an emoji (optionally on a colored swatch), or a plain swatch. */
  function visualHtml(word){
    if (word.img){
      return '<span class="visual-img"><img src="'+word.img+'" alt="'+escapeHtml(word.en)+'"></span>';
    }
    if (word.emoji && word.swatch){
      return '<span class="swatch" style="background:'+word.swatch+'">'+word.emoji+'</span>';
    }
    if (word.swatch){
      return '<span class="swatch" style="background:'+word.swatch+'"></span>';
    }
    return '<span class="visual">'+word.emoji+'</span>';
  }
  /* Used anywhere a picture would normally appear (match-up/bingo choices, memory's picture side).
     When "Hide pictures" is on, falls back to a text label instead — English, or pinyin if
     "Hide English" is also on — so the game still works, just harder. */
  function visualOrTextHtml(word){
    if (!SETTINGS.hideImages) return visualHtml(word);
    var label = SETTINGS.hideEnglish ? word.pinyin : word.en;
    return '<span class="fallback-label">'+escapeHtml(label)+'</span>';
  }
  /* Small picture used in the home-screen subject tile preview strip. */
  function previewChip(word){
    if (word.img) return '<span class="visual-img" style="width:18px;height:27px;display:inline-flex;vertical-align:middle;"><img src="'+word.img+'" alt=""></span>';
    if (word.emoji) return '<span style="font-size:22px;vertical-align:middle;">'+word.emoji+'</span>';
    if (word.swatch) return '<span style="display:inline-block;width:16px;height:16px;border-radius:50%;background:'+word.swatch+';vertical-align:middle;border:2px solid rgba(120,130,150,.28);"></span>';
    return '';
  }

  /* ============ difficulty settings (per-device, local only) ============ */
  var SETTINGS_KEY = 'mandarin-playroom-settings-v1';
  function loadSettings(){
    try{
      var raw = window.localStorage.getItem(SETTINGS_KEY);
      var s = raw ? JSON.parse(raw) : {};
      return { hideImages: !!s.hideImages, hideEnglish: !!s.hideEnglish };
    }catch(e){ return { hideImages:false, hideEnglish:false }; }
  }
  function saveSettings(s){
    try{ window.localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }catch(e){ /* ignore */ }
  }
  var SETTINGS = loadSettings();

  /* ============ progress (per-device, local only) ============ */
  var PROGRESS_KEY = 'mandarin-playroom-progress-v2';
  var GAME_MODES = ['match','memory','sentence','fillblank','bingo','write'];
  function loadProgress(){
    try{
      var raw = window.localStorage.getItem(PROGRESS_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function saveProgress(p){
    try{ window.localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); }catch(e){ /* ignore */ }
  }
  function markDone(subjectId, mode){
    var p = loadProgress();
    p[subjectId] = p[subjectId] || {};
    p[subjectId][mode] = true;
    saveProgress(p);
  }

  /* ============ state ============ */
  var STATE = { view:'home', subjectId:null };

  function go(view, subjectId){
    STATE = { view:view, subjectId: subjectId || null };
    renderApp();
    window.scrollTo(0,0);
    persistHot();
  }

  /* ============ mascot ============ */
  var PANDA_SVG = '<svg class="panda" viewBox="0 0 64 64" aria-hidden="true">'+
    '<circle cx="32" cy="36" r="22" fill="#fff"/>'+
    '<circle cx="14" cy="16" r="9" fill="#2b2b33"/><circle cx="50" cy="16" r="9" fill="#2b2b33"/>'+
    '<circle cx="16" cy="18" r="4.5" fill="#fff"/><circle cx="48" cy="18" r="4.5" fill="#fff"/>'+
    '<ellipse cx="21" cy="34" rx="7" ry="9" fill="#2b2b33"/><ellipse cx="43" cy="34" rx="7" ry="9" fill="#2b2b33"/>'+
    '<circle cx="32" cy="42" r="4" fill="#2b2b33"/>'+
    '<path d="M26 47 Q32 52 38 47" stroke="#2b2b33" stroke-width="2" fill="none" stroke-linecap="round"/>'+
    '</svg>';

  /* ============ HOME ============ */
  function renderHome(){
    SUBJECTS.forEach(function(o){ if (o.revision) refreshRevision(o); });
    var progress = loadProgress();
    var tiles = SUBJECTS.map(function(s){
      var done = progress[s.id] || {};
      var preview = s.words.slice(0,4).map(previewChip).join(' ');
      var starsRow = GAME_MODES.map(function(m){ return done[m] ? '⭐' : '☆'; }).join('');
      return (
        '<button class="tile" data-subject="'+s.id+'" style="--accent:var(--'+s.accent+')">'+
          '<span class="icon">'+s.icon+'</span>'+
          '<h2>'+escapeHtml(s.name)+'</h2>'+
          '<div class="preview">'+preview+'</div>'+
          '<div class="stars"><span>'+starsRow+'</span></div>'+
        '</button>'
      );
    }).join('');

    $('#app').innerHTML =
      '<div class="top">'+PANDA_SVG+
        '<div><h1>Mandarin Playroom</h1><div class="tag">Learn Chinese words and sentences through play</div></div>'+
      '</div>'+
      '<div class="intro-line">Pick a subject to start playing!</div>'+
      '<div class="tiles">'+tiles+'</div>'+
      '<button class="sound-sort-banner" id="soundSortBtn">'+
        '<span class="ss-icon">🔀</span>'+
        '<div><div class="ss-title">Sound Sort</div><div class="ss-desc">Mix two subjects and sort pictures by sound</div></div>'+
      '</button>'+
      '<button class="sent-banner" id="sentBtn">'+
        '<span class="ss-icon">💬</span>'+
        '<div><div class="ss-title">Sentences</div><div class="ss-desc">Learn hello, thank you, sorry and more by heart</div></div>'+
      '</button>'+
      '<button class="songs-banner" id="songsBtn">'+
        '<span class="ss-icon">🎵</span>'+
        '<div><div class="ss-title">Songs</div><div class="ss-desc">Sing along, line by line</div></div>'+
      '</button>'+
      '<footer>Made with ❤️ for a curious learner, one game at a time.</footer>';

    $all('.tile', $('#app')).forEach(function(btn){
      btn.addEventListener('click', function(){ go('subject', btn.getAttribute('data-subject')); });
    });
    $('#soundSortBtn', $('#app')).addEventListener('click', function(){ go('sortPicker'); });
    $('#sentBtn', $('#app')).addEventListener('click', function(){ go('sentences'); });
    $('#songsBtn', $('#app')).addEventListener('click', function(){ go('songs'); });
  }

  /* ============ SUBJECT HUB ============ */
  function renderSubject(id){
    var s = findSubject(id);
    if (!s){ go('home'); return; }
    if (s.revision && !s.words.length) refreshRevision(s);
    var cards = s.words.map(function(w){
      return (
        '<button class="word-card" data-hanzi="'+escapeHtml(w.hanzi)+'">'+
          (SETTINGS.hideImages ? '' : visualHtml(w))+
          '<span class="hanzi">'+escapeHtml(w.hanzi)+'</span>'+
          '<span class="pinyin">'+escapeHtml(w.pinyin)+'</span>'+
          (SETTINGS.hideEnglish ? '' : '<span class="en">'+escapeHtml(w.en)+'</span>')+
          '<span class="speak-note">🔊</span>'+
        '</button>'
      );
    }).join('');

    $('#app').innerHTML =
      '<div class="top">'+
        '<button class="back-btn">← Playroom</button>'+
        '<div class="top-spacer"></div>'+
      '</div>'+
      '<div class="subject-head">'+
        '<span class="icon-badge" style="--accent:var(--'+s.accent+')">'+s.icon+'</span>'+
        '<h2>'+escapeHtml(s.name)+'</h2>'+
      '</div>'+
      '<div class="intro-line">Tap a word to hear it, then try a game.</div>'+
      '<div class="settings-panel">'+
        '<span class="set-label">🎚️ Make it harder:</span>'+
        '<label><input type="checkbox" id="hideImagesChk" '+(SETTINGS.hideImages?'checked':'')+'> Hide pictures</label>'+
        '<label><input type="checkbox" id="hideEnglishChk" '+(SETTINGS.hideEnglish?'checked':'')+'> Hide English</label>'+
      '</div>'+
      '<div class="word-grid">'+cards+'</div>'+
      '<div class="mode-row">'+
        '<button class="mode-btn" data-mode="match" style="--accent:var(--coral)">'+
          '<span class="emo">🧩</span><span class="title">Match-Up</span>'+
          '<span class="desc">Hear a word, tap the matching picture</span>'+
        '</button>'+
        '<button class="mode-btn" data-mode="memory" style="--accent:var(--purple)">'+
          '<span class="emo">🃏</span><span class="title">Memory</span>'+
          '<span class="desc">Flip cards to find the matching pairs</span>'+
        '</button>'+
        '<button class="mode-btn" data-mode="sentence" style="--accent:var(--sun)">'+
          '<span class="emo">🧱</span><span class="title">Sentence Builder</span>'+
          '<span class="desc">Arrange tiles to build a sentence</span>'+
        '</button>'+
        '<button class="mode-btn" data-mode="fillblank" style="--accent:var(--sky)">'+
          '<span class="emo">📝</span><span class="title">Fill-in-the-Blank</span>'+
          '<span class="desc">Complete the sentence with the right picture</span>'+
        '</button>'+
        '<button class="mode-btn" data-mode="bingo" style="--accent:var(--bamboo)">'+
          '<span class="emo">🎯</span><span class="title">Picture Bingo</span>'+
          '<span class="desc">Listen and tap every picture called</span>'+
        '</button>'+
        '<button class="mode-btn" data-mode="write" style="--accent:var(--gold)">'+
          '<span class="emo">✍️</span><span class="title">Write It</span>'+
          '<span class="desc">Trace the dotted word with your finger</span>'+
        '</button>'+
      '</div>';

    $('.back-btn', $('#app')).addEventListener('click', function(){ go('home'); });
    $all('.word-card', $('#app')).forEach(function(btn, i){
      btn.addEventListener('click', function(){ speak(s.words[i].hanzi, 'zh-CN'); });
    });
    if (s.revision){
      /* Sentence games need one shared sentence pattern, so Revision only offers the word games. */
      $all('.mode-btn[data-mode="sentence"], .mode-btn[data-mode="fillblank"]', $('#app')).forEach(function(b){ b.parentNode.removeChild(b); });
    }
    $all('.mode-btn', $('#app')).forEach(function(btn){
      btn.addEventListener('click', function(){ go(btn.getAttribute('data-mode'), s.id); });
    });
    $('#hideImagesChk', $('#app')).addEventListener('change', function(){
      SETTINGS.hideImages = this.checked;
      saveSettings(SETTINGS);
      renderSubject(id);
    });
    $('#hideEnglishChk', $('#app')).addEventListener('change', function(){
      SETTINGS.hideEnglish = this.checked;
      saveSettings(SETTINGS);
      renderSubject(id);
    });
  }

  /* ============ MATCH-UP GAME ============ */
  var matchRun = null; // { subjectId, order:[words], idx, locked }

  function startMatch(subjectId){
    var s = findSubject(subjectId);
    matchRun = { subjectId: subjectId, order: shuffle(s.words), idx: 0, locked:false };
  }

  function renderMatch(subjectId){
    if (!matchRun || matchRun.subjectId !== subjectId) startMatch(subjectId);
    var s = findSubject(subjectId);

    if (matchRun.idx >= matchRun.order.length){
      markDone(subjectId, 'match');
      renderCelebrate(s, 'match');
      return;
    }

    var target = matchRun.order[matchRun.idx];
    var distractors = shuffle(s.words.filter(function(w){ return w.hanzi !== target.hanzi; })).slice(0,3);
    var choices = shuffle([target].concat(distractors));

    var dots = matchRun.order.map(function(w,i){
      var cls = i < matchRun.idx ? 'done' : (i === matchRun.idx ? 'current' : '');
      return '<span class="dot '+cls+'"></span>';
    }).join('');

    var choiceHtml = choices.map(function(w, i){
      return '<button class="choice-tile" data-hanzi="'+escapeHtml(w.hanzi)+'" data-i="'+i+'">'+visualOrTextHtml(w)+'</button>';
    }).join('');

    $('#app').innerHTML =
      '<div class="top">'+
        '<button class="back-btn">← '+escapeHtml(s.name)+'</button>'+
      '</div>'+
      '<h2>Match-Up · '+escapeHtml(s.name)+'</h2>'+
      '<div class="progress-dots">'+dots+'</div>'+
      '<button class="prompt-card" id="promptCard">'+
        '<div class="hanzi">'+escapeHtml(target.hanzi)+'</div>'+
        '<div class="pinyin">'+escapeHtml(target.pinyin)+'</div>'+
        '<div class="tap-hint">🔊 Tap to hear it again</div>'+
      '</button>'+
      '<div class="choice-grid">'+choiceHtml+'</div>';

    $('.back-btn', $('#app')).addEventListener('click', function(){ matchRun=null; go('subject', subjectId); });
    $('#promptCard', $('#app')).addEventListener('click', function(){ speak(target.hanzi, 'zh-CN'); });
    speak(target.hanzi, 'zh-CN');

    $all('.choice-tile', $('#app')).forEach(function(tile){
      tile.addEventListener('click', function(){
        if (matchRun.locked) return;
        var isCorrect = tile.getAttribute('data-hanzi') === target.hanzi;
        if (isCorrect){
          matchRun.locked = true;
          tile.classList.add('correct');
          playCorrectSound();
          speak(target.hanzi + '，' + target.en, 'zh-CN');
          setTimeout(function(){
            matchRun.idx += 1;
            matchRun.locked = false;
            renderMatch(subjectId);
          }, 850);
        } else {
          tile.classList.add('wrong');
          playWrongSound();
          setTimeout(function(){ tile.classList.remove('wrong'); }, 420);
        }
      });
    });
  }

  /* ============ MEMORY GAME ============ */
  var memRun = null; // { subjectId, cards:[{key,type,word,matched}], open:[idx], busy, found }

  function buildMemoryCards(s){
    var cards = [];
    s.words.forEach(function(w){
      cards.push({ key:w.hanzi, type:'text', word:w, matched:false });
      cards.push({ key:w.hanzi, type:'visual', word:w, matched:false });
    });
    return shuffle(cards);
  }

  function startMemory(subjectId){
    var s = findSubject(subjectId);
    memRun = { subjectId: subjectId, cards: buildMemoryCards(s), open:[], busy:false, found:0 };
  }

  function memColumns(n){
    if (n <= 16) return 4;
    return 5;
  }

  function renderMemory(subjectId){
    if (!memRun || memRun.subjectId !== subjectId) startMemory(subjectId);
    var s = findSubject(subjectId);

    if (memRun.found === s.words.length){
      markDone(subjectId, 'memory');
      renderCelebrate(s, 'memory');
      return;
    }

    var cols = memColumns(memRun.cards.length);
    var cardsHtml = memRun.cards.map(function(c, i){
      var isOpen = memRun.open.indexOf(i) !== -1;
      var stateClass = c.matched ? 'is-matched' : (isOpen ? 'is-open' : '');
      var backInner = c.type === 'visual'
        ? visualOrTextHtml(c.word)
        : '<span class="hanzi">'+escapeHtml(c.word.hanzi)+'</span><span class="pinyin">'+escapeHtml(c.word.pinyin)+'</span>';
      return (
        '<div class="flip-card '+stateClass+'" data-i="'+i+'">'+
          '<button aria-label="memory card">'+
            '<span class="flip-face flip-front">🐼</span>'+
            '<span class="flip-face flip-back">'+backInner+'</span>'+
          '</button>'+
        '</div>'
      );
    }).join('');

    $('#app').innerHTML =
      '<div class="top">'+
        '<button class="back-btn">← '+escapeHtml(s.name)+'</button>'+
      '</div>'+
      '<h2>Memory · '+escapeHtml(s.name)+'</h2>'+
      '<div class="stat-row"><span>Pairs found: <b>'+memRun.found+' / '+s.words.length+'</b></span></div>'+
      '<div class="memory-grid" style="--cols:'+cols+'">'+cardsHtml+'</div>';

    $('.back-btn', $('#app')).addEventListener('click', function(){ memRun=null; go('subject', subjectId); });

    $all('.flip-card', $('#app')).forEach(function(el){
      el.querySelector('button').addEventListener('click', function(){
        if (memRun.busy) return;
        var i = parseInt(el.getAttribute('data-i'),10);
        var card = memRun.cards[i];
        if (card.matched || memRun.open.indexOf(i) !== -1) return;
        if (memRun.open.length === 0){
          memRun.open = [i];
          renderMemory(subjectId);
          return;
        }
        if (memRun.open.length === 1){
          var firstI = memRun.open[0];
          var first = memRun.cards[firstI];
          memRun.open.push(i);
          if (first.key === card.key && first.type !== card.type){
            first.matched = true; card.matched = true;
            memRun.found += 1;
            memRun.open = [];
            playCorrectSound();
            speak(card.word.hanzi, 'zh-CN');
            renderMemory(subjectId);
          } else {
            memRun.busy = true;
            playWrongSound();
            renderMemory(subjectId);
            setTimeout(function(){
              memRun.open = [];
              memRun.busy = false;
              renderMemory(subjectId);
            }, 800);
          }
        }
      });
    });
  }

  /* ============ SENTENCE BUILDER ============ */
  var sbRun = null; // { subjectId, order, idx, slots:[pieceId|null, pieceId|null], bankOrder:[0,1]|null, locked }

  function startSentenceBuilder(subjectId){
    var s = findSubject(subjectId);
    sbRun = { subjectId: subjectId, order: shuffle(s.words), idx:0, slots:[null,null], bankOrder:null, locked:false };
  }

  function renderSentenceBuilder(subjectId){
    if (!sbRun || sbRun.subjectId !== subjectId) startSentenceBuilder(subjectId);
    var s = findSubject(subjectId);

    if (sbRun.idx >= sbRun.order.length){
      markDone(subjectId, 'sentence');
      renderCelebrate(s, 'sentence');
      return;
    }

    var word = sbRun.order[sbRun.idx];
    var zhFull = sentenceZh(s, word);
    var enFull = sentenceEn(s, word);

    var pieces = [
      { id:'prefix', label:s.sentence.zhPrefix },
      { id:'word', label:word.hanzi }
    ];
    if (!sbRun.bankOrder) sbRun.bankOrder = shuffle([0,1]);

    var dots = sbRun.order.map(function(w,i){
      var cls = i < sbRun.idx ? 'done' : (i === sbRun.idx ? 'current' : '');
      return '<span class="dot '+cls+'"></span>';
    }).join('');

    var slotsHtml = sbRun.slots.map(function(pieceId, i){
      if (pieceId === null) return '<div class="assembly-slot" data-slot="'+i+'">?</div>';
      var piece = pieces.filter(function(p){ return p.id === pieceId; })[0];
      return '<div class="assembly-slot filled" data-slot="'+i+'">'+escapeHtml(piece.label)+'</div>';
    }).join('');

    var bankHtml = sbRun.bankOrder.map(function(pi){
      var piece = pieces[pi];
      var used = sbRun.slots.indexOf(piece.id) !== -1;
      return '<button class="word-tile'+(used?' used':'')+'" data-piece="'+piece.id+'">'+escapeHtml(piece.label)+'</button>';
    }).join('');

    $('#app').innerHTML =
      '<div class="top"><button class="back-btn">← '+escapeHtml(s.name)+'</button></div>'+
      '<h2>Sentence Builder · '+escapeHtml(s.name)+'</h2>'+
      '<div class="progress-dots">'+dots+'</div>'+
      '<div class="sentence-prompt">'+
        '<div class="sent-visual">'+visualOrTextHtml(word)+'</div>'+
        '<button class="hear-btn" id="sbHear" type="button">🔊 Hear the sentence</button>'+
      '</div>'+
      '<div class="assembly-row">'+slotsHtml+'</div>'+
      '<div class="tile-bank">'+bankHtml+'</div>'+
      '<div class="sentence-caption" id="sbCaption"></div>';

    $('.back-btn', $('#app')).addEventListener('click', function(){ sbRun=null; go('subject', subjectId); });
    $('#sbHear', $('#app')).addEventListener('click', function(){ speak(zhFull, 'zh-CN'); });

    if (sbRun.slots[0] === null && sbRun.slots[1] === null){
      speak(zhFull, 'zh-CN');
    }

    $all('.word-tile', $('#app')).forEach(function(btn){
      btn.addEventListener('click', function(){
        if (sbRun.locked) return;
        var pieceId = btn.getAttribute('data-piece');
        if (sbRun.slots.indexOf(pieceId) !== -1) return;
        var emptyIdx = sbRun.slots.indexOf(null);
        if (emptyIdx === -1) return;
        sbRun.slots[emptyIdx] = pieceId;

        if (sbRun.slots.indexOf(null) === -1){
          var correct = sbRun.slots[0] === 'prefix' && sbRun.slots[1] === 'word';
          sbRun.locked = true;
          renderSentenceBuilder(subjectId);
          var slotEls = $all('.assembly-slot', $('#app'));
          if (correct){
            slotEls.forEach(function(el){ el.classList.add('correct'); });
            playCorrectSound();
            speak(zhFull, 'zh-CN');
            var cap = $('#sbCaption', $('#app'));
            if (cap && !SETTINGS.hideEnglish) cap.textContent = enFull;
            setTimeout(function(){
              sbRun.idx += 1;
              sbRun.slots = [null,null];
              sbRun.bankOrder = null;
              sbRun.locked = false;
              renderSentenceBuilder(subjectId);
            }, 1100);
          } else {
            slotEls.forEach(function(el){ el.classList.add('wrong'); });
            playWrongSound();
            setTimeout(function(){
              sbRun.slots = [null,null];
              sbRun.locked = false;
              renderSentenceBuilder(subjectId);
            }, 700);
          }
          return;
        }
        renderSentenceBuilder(subjectId);
      });
    });

    $all('.assembly-slot', $('#app')).forEach(function(el){
      el.addEventListener('click', function(){
        if (sbRun.locked) return;
        var i = parseInt(el.getAttribute('data-slot'), 10);
        if (sbRun.slots[i] !== null){
          sbRun.slots[i] = null;
          renderSentenceBuilder(subjectId);
        }
      });
    });
  }

  /* ============ FILL-IN-THE-BLANK ============ */
  var fbRun = null; // { subjectId, order, idx, locked }

  function startFillBlank(subjectId){
    var s = findSubject(subjectId);
    fbRun = { subjectId: subjectId, order: shuffle(s.words), idx:0, locked:false };
  }

  function renderFillBlank(subjectId){
    if (!fbRun || fbRun.subjectId !== subjectId) startFillBlank(subjectId);
    var s = findSubject(subjectId);

    if (fbRun.idx >= fbRun.order.length){
      markDone(subjectId, 'fillblank');
      renderCelebrate(s, 'fillblank');
      return;
    }

    var target = fbRun.order[fbRun.idx];
    var distractors = shuffle(s.words.filter(function(w){ return w.hanzi !== target.hanzi; })).slice(0,3);
    var choices = shuffle([target].concat(distractors));

    var dots = fbRun.order.map(function(w,i){
      var cls = i < fbRun.idx ? 'done' : (i === fbRun.idx ? 'current' : '');
      return '<span class="dot '+cls+'"></span>';
    }).join('');

    var choiceHtml = choices.map(function(w, i){
      return '<button class="choice-tile" data-hanzi="'+escapeHtml(w.hanzi)+'" data-i="'+i+'">'+visualOrTextHtml(w)+'</button>';
    }).join('');

    $('#app').innerHTML =
      '<div class="top"><button class="back-btn">← '+escapeHtml(s.name)+'</button></div>'+
      '<h2>Fill-in-the-Blank · '+escapeHtml(s.name)+'</h2>'+
      '<div class="progress-dots">'+dots+'</div>'+
      '<button class="prompt-card" id="fbPrompt">'+
        '<div class="hanzi">'+escapeHtml(s.sentence.zhPrefix)+'<span class="blank-mark">___</span></div>'+
        '<div class="pinyin">'+escapeHtml(s.sentence.zhPrefixPinyin)+' ___</div>'+
        '<div class="tap-hint">🔊 Tap to hear the sentence start</div>'+
      '</button>'+
      '<div class="choice-grid">'+choiceHtml+'</div>';

    $('.back-btn', $('#app')).addEventListener('click', function(){ fbRun=null; go('subject', subjectId); });
    $('#fbPrompt', $('#app')).addEventListener('click', function(){ speak(s.sentence.zhPrefix, 'zh-CN'); });
    speak(s.sentence.zhPrefix, 'zh-CN');

    $all('.choice-tile', $('#app')).forEach(function(tile){
      tile.addEventListener('click', function(){
        if (fbRun.locked) return;
        var isCorrect = tile.getAttribute('data-hanzi') === target.hanzi;
        if (isCorrect){
          fbRun.locked = true;
          tile.classList.add('correct');
          playCorrectSound();
          speak(sentenceZh(s, target), 'zh-CN');
          setTimeout(function(){
            fbRun.idx += 1;
            fbRun.locked = false;
            renderFillBlank(subjectId);
          }, 900);
        } else {
          tile.classList.add('wrong');
          playWrongSound();
          setTimeout(function(){ tile.classList.remove('wrong'); }, 420);
        }
      });
    });
  }

  /* ============ PICTURE BINGO ============ */
  var bingoRun = null; // { subjectId, board:[words], calls:[words], calledIdx, marked:{hanzi:true} }

  function startBingo(subjectId){
    var s = findSubject(subjectId);
    bingoRun = { subjectId: subjectId, board: shuffle(s.words), calls: shuffle(s.words), calledIdx:0, marked:{} };
  }

  function renderBingo(subjectId){
    if (!bingoRun || bingoRun.subjectId !== subjectId) startBingo(subjectId);
    var s = findSubject(subjectId);

    var markedCount = Object.keys(bingoRun.marked).length;
    if (markedCount === bingoRun.board.length){
      markDone(subjectId, 'bingo');
      renderCelebrate(s, 'bingo');
      return;
    }

    var currentCall = bingoRun.calls[bingoRun.calledIdx];

    var tilesHtml = bingoRun.board.map(function(w){
      var marked = !!bingoRun.marked[w.hanzi];
      return '<button class="bingo-tile'+(marked?' marked':'')+'" data-hanzi="'+escapeHtml(w.hanzi)+'">'+
        (marked ? '<span style="font-size:30px;">✅</span>' : visualOrTextHtml(w)) +
      '</button>';
    }).join('');

    $('#app').innerHTML =
      '<div class="top"><button class="back-btn">← '+escapeHtml(s.name)+'</button></div>'+
      '<h2>Picture Bingo · '+escapeHtml(s.name)+'</h2>'+
      '<div class="bingo-call-row">'+
        '<span class="set-label">🔔 Listen, then tap the picture!</span>'+
        '<button class="repeat-btn" id="bingoRepeat" type="button">🔊 Repeat</button>'+
      '</div>'+
      '<div class="stat-row"><span>Found: <b>'+markedCount+' / '+bingoRun.board.length+'</b></span></div>'+
      '<div class="bingo-grid">'+tilesHtml+'</div>';

    $('.back-btn', $('#app')).addEventListener('click', function(){ bingoRun=null; go('subject', subjectId); });
    $('#bingoRepeat', $('#app')).addEventListener('click', function(){ speak(currentCall.hanzi, 'zh-CN'); });
    speak(currentCall.hanzi, 'zh-CN');

    $all('.bingo-tile', $('#app')).forEach(function(tile){
      tile.addEventListener('click', function(){
        var hanzi = tile.getAttribute('data-hanzi');
        if (bingoRun.marked[hanzi]) return;
        if (hanzi === currentCall.hanzi){
          bingoRun.marked[hanzi] = true;
          playCorrectSound();
          speak(currentCall.hanzi + '，' + currentCall.en, 'zh-CN');
          bingoRun.calledIdx = Math.min(bingoRun.calledIdx + 1, bingoRun.calls.length - 1);
          setTimeout(function(){ renderBingo(subjectId); }, 700);
        } else {
          tile.classList.add('wrong');
          playWrongSound();
          setTimeout(function(){ tile.classList.remove('wrong'); }, 420);
        }
      });
    });
  }

  /* ============ WRITE IT (tracing) ============
     Level 1 = dotted outline to trace, Level 2 = fainter dots, Level 3 = from memory (guide hidden, optional hint).
     Draw with a mouse, finger or Apple Pencil. Progress is measured by how much of the character was covered. */
  var writeRun = null;   // { subjectId, level, order:[words], idx, locked }
  var writeLevel = 1;
  var WRITE_THRESHOLD = { 1:0.5, 2:0.45, 3:0.4 };
  var WRITE_LEVEL_NAMES = { 1:'Dotted', 2:'Faint', 3:'Memory' };
  var WRITE_FONT = '"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif';

  function writeLevelKey(level){ return level === 1 ? 'write' : 'write' + level; }
  function writeUnlocked(subjectId, level){
    if (level <= 1) return true;
    var p = loadProgress()[subjectId] || {};
    return !!p[writeLevelKey(level - 1)];
  }
  function startWrite(subjectId){
    var s = findSubject(subjectId);
    if (!writeUnlocked(subjectId, writeLevel)) writeLevel = 1;
    writeRun = { subjectId: subjectId, level: writeLevel, order: shuffle(s.words).slice(0, 8), idx: 0, locked: false };
  }
  function writeColors(){
    var cs = window.getComputedStyle(document.documentElement);
    return {
      soft: (cs.getPropertyValue('--ink-soft') || '').trim() || '#5B6889',
      ink:  (cs.getPropertyValue('--coral') || '').trim() || '#FF6B5B'
    };
  }
  /* Layout of the writing pad: one square cell per character. */
  function writeGeometry(hanzi){
    var chars = Array.from(hanzi), n = chars.length;
    /* 1-3 characters sit in one row; 4 or more wrap into rows of 2 so each character stays big. */
    var cols = (n >= 4) ? 2 : n, rows = Math.ceil(n / cols);
    var W = 600, H = (rows > 1) ? 600 : (n === 1 ? 600 : (n === 2 ? 400 : 300));
    var cw = W / cols, ch = H / rows;
    var font = Math.floor(Math.min(ch * 0.8, cw * 0.8));
    var cells = chars.map(function(c, i){
      var col = i % cols, row = Math.floor(i / cols);
      return { x0: col * cw, y0: row * ch, w: cw, h: ch, cx: col * cw + cw / 2, cy: row * ch + ch / 2 + font * 0.04 };
    });
    return { chars: chars, n: n, cols: cols, rows: rows, W: W, H: H, cells: cells, font: font, brush: Math.max(14, Math.round(font * 0.06)) };
  }
  function drawWriteGrid(ctx, g, color){
    ctx.save();
    ctx.strokeStyle = color; ctx.globalAlpha = 0.35; ctx.lineWidth = 2; ctx.setLineDash([8, 8]);
    g.cells.forEach(function(c){
      ctx.beginPath(); ctx.moveTo(c.x0 + 10, c.y0 + c.h / 2); ctx.lineTo(c.x0 + c.w - 10, c.y0 + c.h / 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(c.cx, c.y0 + 10); ctx.lineTo(c.cx, c.y0 + c.h - 10); ctx.stroke();
    });
    ctx.setLineDash([]); ctx.globalAlpha = 0.25;
    for (var j = 1; j < g.cols; j++){
      ctx.beginPath(); ctx.moveTo(j * g.W / g.cols, 0); ctx.lineTo(j * g.W / g.cols, g.H); ctx.stroke();
    }
    for (var r = 1; r < g.rows; r++){
      ctx.beginPath(); ctx.moveTo(0, r * g.H / g.rows); ctx.lineTo(g.W, r * g.H / g.rows); ctx.stroke();
    }
    ctx.restore();
  }
  /* Dots along the outline of the character. Built from pixels (not strokeText) so it looks the same with any Chinese font. */
  function glyphEdgeDots(g, spacing){
    var c = document.createElement('canvas'); c.width = g.W; c.height = g.H;
    var x = c.getContext('2d');
    x.font = '700 ' + g.font + 'px ' + WRITE_FONT; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#000';
    g.chars.forEach(function(ch, i){ x.fillText(ch, g.cells[i].cx, g.cells[i].cy); });
    var W = g.W, H = g.H, d = x.getImageData(0, 0, W, H).data;
    function ink(px, py){ return px >= 0 && py >= 0 && px < W && py < H && d[(py * W + px) * 4 + 3] > 128; }
    var cell = spacing, cols = Math.ceil(W / cell) + 1, grid = {}, dots = [];
    for (var yy = 0; yy < H; yy++){
      for (var xx = 0; xx < W; xx++){
        if (!ink(xx, yy)) continue;
        if (ink(xx - 1, yy) && ink(xx + 1, yy) && ink(xx, yy - 1) && ink(xx, yy + 1)) continue;
        var gx = Math.floor(xx / cell), gy = Math.floor(yy / cell), ok = true;
        for (var a = -1; a <= 1 && ok; a++){
          for (var b = -1; b <= 1 && ok; b++){
            var arr = grid[(gy + b) * cols + (gx + a)];
            if (!arr) continue;
            for (var k = 0; k < arr.length; k++){
              var dx = arr[k][0] - xx, dy = arr[k][1] - yy;
              if (dx * dx + dy * dy < spacing * spacing){ ok = false; break; }
            }
          }
        }
        if (ok){
          var key = gy * cols + gx;
          (grid[key] = grid[key] || []).push([xx, yy]);
          dots.push([xx, yy]);
        }
      }
    }
    return dots;
  }
  function drawWriteGlyph(ctx, g, style, color){
    ctx.save();
    ctx.font = '700 ' + g.font + 'px ' + WRITE_FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    if (style === 'dotted'){
      ctx.globalAlpha = 0.16;
      g.chars.forEach(function(ch, i){ ctx.fillText(ch, g.cells[i].cx, g.cells[i].cy); });
    }
    var dots = glyphEdgeDots(g, style === 'dotted' ? 11 : 13);
    ctx.globalAlpha = style === 'dotted' ? 1 : 0.55;
    var r = style === 'dotted' ? 3 : 2.4;
    dots.forEach(function(p){ ctx.beginPath(); ctx.arc(p[0] + 0.5, p[1] + 0.5, r, 0, Math.PI * 2); ctx.fill(); });
    ctx.restore();
  }
  /* Low-resolution masks of the character, used to measure how well the child traced it. */
  function buildWriteMasks(g){
    var mw = 200, sc = mw / g.W, mh = Math.round(g.H * sc);
    function make(loose){
      var c = document.createElement('canvas'); c.width = mw; c.height = mh;
      var x = c.getContext('2d'); x.scale(sc, sc);
      x.font = '700 ' + g.font + 'px ' + WRITE_FONT; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillStyle = '#000'; x.strokeStyle = '#000'; x.lineJoin = 'round'; x.lineWidth = g.brush * 1.6;
      g.chars.forEach(function(ch, i){
        var cx = g.cells[i].cx, cy = g.cells[i].cy;
        x.fillText(ch, cx, cy);
        if (loose) x.strokeText(ch, cx, cy);
      });
      var d = x.getImageData(0, 0, mw, mh).data, m = new Uint8Array(mw * mh), count = 0;
      for (var i = 0; i < m.length; i++){ if (d[i * 4 + 3] > 128){ m[i] = 1; count++; } }
      return { data: m, count: count };
    }
    var tmp = document.createElement('canvas'); tmp.width = mw; tmp.height = mh;
    return { mw: mw, mh: mh, tight: make(false), loose: make(true), tmp: tmp };
  }
  function evaluateWrite(inkCanvas, masks){
    var tctx = masks.tmp.getContext('2d');
    tctx.clearRect(0, 0, masks.mw, masks.mh);
    tctx.drawImage(inkCanvas, 0, 0, inkCanvas.width, inkCanvas.height, 0, 0, masks.mw, masks.mh);
    var d = tctx.getImageData(0, 0, masks.mw, masks.mh).data;
    var hit = 0, inkTotal = 0, outside = 0;
    for (var i = 0; i < masks.tight.data.length; i++){
      if (d[i * 4 + 3] > 40){
        inkTotal++;
        if (!masks.loose.data[i]) outside++;
        if (masks.tight.data[i]) hit++;
      }
    }
    return {
      coverage: masks.tight.count ? hit / masks.tight.count : 0,
      scribble: inkTotal > 0 && (outside / inkTotal) > 0.4
    };
  }

  function renderWrite(subjectId){
    var s = findSubject(subjectId);
    if (!s){ go('home'); return; }
    if (!writeRun || writeRun.subjectId !== subjectId || writeRun.level !== writeLevel) startWrite(subjectId);

    if (writeRun.idx >= writeRun.order.length){
      markDone(subjectId, writeLevelKey(writeRun.level));
      renderWriteCelebrate(s, writeRun.level);
      return;
    }

    var level = writeRun.level;
    var word = writeRun.order[writeRun.idx];
    var g = writeGeometry(word.hanzi);
    var thr = WRITE_THRESHOLD[level];

    var dots = writeRun.order.map(function(w, i){
      var cls = i < writeRun.idx ? 'done' : (i === writeRun.idx ? 'current' : '');
      return '<span class="dot ' + cls + '"></span>';
    }).join('');

    var chips = [1, 2, 3].map(function(l){
      var unlocked = writeUnlocked(subjectId, l);
      return '<button class="level-chip' + (l === level ? ' selected' : '') + (unlocked ? '' : ' locked') + '" data-level="' + l + '">' +
        (unlocked ? '' : '🔒 ') + 'Level ' + l + ' · ' + WRITE_LEVEL_NAMES[l] + '</button>';
    }).join('');

    $('#app').innerHTML =
      '<div class="top"><button class="back-btn">← ' + escapeHtml(s.name) + '</button></div>' +
      '<h2>Write It · ' + escapeHtml(s.name) + '</h2>' +
      '<div class="progress-dots">' + dots + '</div>' +
      '<div class="level-chips">' + chips + '</div>' +
      '<div class="write-layout">' +
        '<div class="write-info">' +
          visualOrTextHtml(word) +
          '<div class="w-text"><div class="w-pinyin">' + escapeHtml(word.pinyin) + '</div>' +
          (SETTINGS.hideEnglish ? '' : '<div class="w-en">' + escapeHtml(word.en) + '</div>') + '</div>' +
          '<button class="write-btn" id="writeHear" type="button">🔊 Hear it</button>' +
        '</div>' +
        '<div>' +
          '<div class="pad-wrap" id="writePad" style="aspect-ratio:' + g.W + '/' + g.H + ';' + (g.W === g.H ? 'max-width:min(100%,480px);' : '') + '">' +
            '<canvas id="writeGuide"></canvas><canvas id="writeInk"></canvas>' +
          '</div>' +
          '<div class="write-meter"><div id="writeMeter"></div></div>' +
          '<div class="write-note" id="writeNote">' + (level === 1 ? 'Trace over the dots with your finger ✍️' : (level === 2 ? 'Follow the faint dots ✍️' : 'Write it from memory — tap Hint if you need help')) + '</div>' +
          '<div class="write-actions">' +
            '<button class="write-btn" id="writeClear" type="button">🧹 Clear</button>' +
            (level === 3 ? '<button class="write-btn" id="writeHint" type="button">👀 Hint</button>' : '') +
            '<button class="write-btn" id="writeSkip" type="button">Skip →</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    $('.back-btn', $('#app')).addEventListener('click', function(){ writeRun = null; go('subject', subjectId); });
    $('#writeHear', $('#app')).addEventListener('click', function(){ speak(word.hanzi, 'zh-CN'); });
    $all('.level-chip', $('#app')).forEach(function(btn){
      btn.addEventListener('click', function(){
        var l = parseInt(btn.getAttribute('data-level'), 10);
        if (!writeUnlocked(subjectId, l)){
          btn.classList.add('wrong');
          var note = $('#writeNote', $('#app'));
          if (note) note.textContent = '🔒 Finish Level ' + (l - 1) + ' to unlock this level';
          setTimeout(function(){ btn.classList.remove('wrong'); }, 420);
          return;
        }
        writeLevel = l; writeRun = null; renderWrite(subjectId);
      });
    });

    var pad = $('#writePad', $('#app'));
    var guide = $('#writeGuide', $('#app'));
    var ink = $('#writeInk', $('#app'));
    var meter = $('#writeMeter', $('#app'));
    var note = $('#writeNote', $('#app'));
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    [guide, ink].forEach(function(cv){ cv.width = Math.round(g.W * dpr); cv.height = Math.round(g.H * dpr); });
    var gctx = guide.getContext('2d'), ictx = ink.getContext('2d');
    gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ictx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var colors = writeColors();
    var baseStyle = level === 1 ? 'dotted' : (level === 2 ? 'faint' : null);
    var masks = null;

    function paintGuide(style){
      gctx.clearRect(0, 0, g.W, g.H);
      drawWriteGrid(gctx, g, colors.soft);
      if (style) drawWriteGlyph(gctx, g, style, colors.soft);
    }
    function setupGuide(){
      paintGuide(baseStyle);
      masks = buildWriteMasks(g);
    }
    setupGuide();
    /* Make sure the Chinese font has loaded, then redraw so the guide and the scoring mask match. */
    try{
      if (document.fonts && document.fonts.load){
        document.fonts.load('700 100px "Noto Sans SC"', word.hanzi).then(function(){
          if (document.body.contains(guide)) setupGuide();
        }).catch(function(){ /* keep fallback font */ });
      }
    }catch(e){ /* ignore */ }

    ictx.lineCap = 'round'; ictx.lineJoin = 'round';
    ictx.strokeStyle = colors.ink; ictx.fillStyle = colors.ink; ictx.lineWidth = g.brush;
    var drawing = false, last = null;

    function pos(e){
      var r = ink.getBoundingClientRect();
      return { x: (e.clientX - r.left) * g.W / r.width, y: (e.clientY - r.top) * g.H / r.height };
    }
    function checkProgress(){
      if (!masks || writeRun.locked) return;
      var res = evaluateWrite(ink, masks);
      var pct = Math.min(100, Math.round(res.coverage / thr * 100));
      meter.style.width = (res.scribble ? 0 : pct) + '%';
      if (res.scribble){
        note.textContent = 'Try to stay on the dots 🙂';
        return;
      }
      if (pct >= 100){
        writeRun.locked = true;
        pad.classList.add('done');
        note.textContent = '⭐ Great writing!';
        playCorrectSound();
        speak(word.hanzi + '，' + word.en, 'zh-CN');
        setTimeout(function(){
          writeRun.idx += 1;
          writeRun.locked = false;
          renderWrite(subjectId);
        }, 1400);
      } else if (pct >= 60){
        note.textContent = 'Almost there — keep going!';
      } else {
        note.textContent = 'Keep tracing ✍️';
      }
    }
    ink.addEventListener('pointerdown', function(e){
      if (writeRun.locked) return;
      e.preventDefault();
      try{ ink.setPointerCapture(e.pointerId); }catch(err){ /* ignore */ }
      drawing = true;
      last = pos(e);
      ictx.beginPath(); ictx.arc(last.x, last.y, g.brush / 2, 0, Math.PI * 2); ictx.fill();
    });
    ink.addEventListener('pointermove', function(e){
      if (!drawing) return;
      e.preventDefault();
      var p = pos(e);
      ictx.beginPath(); ictx.moveTo(last.x, last.y); ictx.lineTo(p.x, p.y); ictx.stroke();
      last = p;
    });
    function endStroke(){ if (!drawing) return; drawing = false; checkProgress(); }
    ink.addEventListener('pointerup', endStroke);
    ink.addEventListener('pointercancel', endStroke);

    $('#writeClear', $('#app')).addEventListener('click', function(){
      if (writeRun.locked) return;
      ictx.clearRect(0, 0, g.W, g.H);
      meter.style.width = '0%';
      note.textContent = 'Fresh start! ✍️';
    });
    var hintBtn = $('#writeHint', $('#app'));
    if (hintBtn) hintBtn.addEventListener('click', function(){
      paintGuide('dotted');
      setTimeout(function(){ if (document.body.contains(guide)) paintGuide(baseStyle); }, 2500);
    });
    $('#writeSkip', $('#app')).addEventListener('click', function(){
      if (writeRun.locked) return;
      writeRun.idx += 1;
      renderWrite(subjectId);
    });
    speak(word.hanzi, 'zh-CN');
  }

  function renderWriteCelebrate(s, level){
    var hasNext = level < 3;
    $('#app').innerHTML =
      '<div class="top"><button class="back-btn">← ' + escapeHtml(s.name) + '</button></div>' +
      '<div class="celebrate">' +
        '<div class="big-emoji">✍️</div>' +
        '<h2>Beautiful writing!</h2>' +
        '<p>You finished Level ' + level + ' (' + WRITE_LEVEL_NAMES[level] + ') for ' + escapeHtml(s.name) + '.' +
          (hasNext ? ' Level ' + (level + 1) + ' is unlocked!' : '') + '</p>' +
        '<div class="stars-row">⭐⭐⭐</div>' +
        '<div class="btn-col">' +
          (hasNext ? '<button class="btn primary" id="writeNextBtn">Next level →</button>' : '') +
          '<button class="btn ' + (hasNext ? 'secondary' : 'primary') + '" id="writeAgainBtn">Play Again</button>' +
          '<button class="btn secondary" id="writeBackBtn">Back to ' + escapeHtml(s.name) + '</button>' +
        '</div>' +
      '</div>';
    $('.back-btn', $('#app')).addEventListener('click', function(){ writeRun = null; go('subject', s.id); });
    $('#writeAgainBtn', $('#app')).addEventListener('click', function(){ writeLevel = level; writeRun = null; go('write', s.id); });
    $('#writeBackBtn', $('#app')).addEventListener('click', function(){ writeRun = null; go('subject', s.id); });
    var nextBtn = $('#writeNextBtn', $('#app'));
    if (nextBtn) nextBtn.addEventListener('click', function(){ writeLevel = level + 1; writeRun = null; go('write', s.id); });
  }

  /* ============ SOUND SORT (cross-subject) ============ */
  var sortSelection = ['animals', 'colors'];
  var sortRun = null; // { aId, bId, queue:[{word,subjectId}], idx }

  function renderSortPicker(){
    var canStart = sortSelection.length === 2;
    var chips = SUBJECTS.filter(function(s){ return !s.revision; }).map(function(s){
      var sel = sortSelection.indexOf(s.id) !== -1;
      return '<button class="sort-chip'+(sel?' selected':'')+'" data-id="'+s.id+'">'+s.icon+' '+escapeHtml(s.name)+'</button>';
    }).join('');
    var startDesc = canStart
      ? ('Mix '+findSubject(sortSelection[0]).name+' + '+findSubject(sortSelection[1]).name)
      : 'Choose exactly 2 subjects';

    $('#app').innerHTML =
      '<div class="top"><button class="back-btn">← Playroom</button></div>'+
      '<h2>🔀 Sound Sort</h2>'+
      '<div class="intro-line">Pick 2 subjects to mix together.</div>'+
      '<div class="sort-picker-grid">'+chips+'</div>'+
      '<button class="mode-btn" id="startSortBtn" style="--accent:var(--purple);'+(canStart?'':'opacity:.5;')+'">'+
        '<span class="emo">▶️</span><span class="title">Start Sorting</span>'+
        '<span class="desc">'+startDesc+'</span>'+
      '</button>';

    $('.back-btn', $('#app')).addEventListener('click', function(){ go('home'); });
    $all('.sort-chip', $('#app')).forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-id');
        var pos = sortSelection.indexOf(id);
        if (pos !== -1) sortSelection.splice(pos,1);
        else if (sortSelection.length < 2) sortSelection.push(id);
        renderSortPicker();
      });
    });
    $('#startSortBtn', $('#app')).addEventListener('click', function(){
      if (sortSelection.length === 2){ sortRun = null; go('soundSort'); }
    });
  }

  function buildSortQueue(aId, bId){
    var a = findSubject(aId), b = findSubject(bId);
    var items = a.words.map(function(w){ return { word:w, subjectId:aId }; })
      .concat(b.words.map(function(w){ return { word:w, subjectId:bId }; }));
    return shuffle(items);
  }
  function startSort(aId, bId){
    sortRun = { aId:aId, bId:bId, queue: buildSortQueue(aId,bId), idx:0 };
  }

  function renderSoundSort(){
    var aId = sortSelection[0], bId = sortSelection[1];
    if (!aId || !bId){ go('sortPicker'); return; }
    if (!sortRun || sortRun.aId !== aId || sortRun.bId !== bId) startSort(aId, bId);
    var a = findSubject(aId), b = findSubject(bId);

    if (sortRun.idx >= sortRun.queue.length){
      renderSortCelebrate(a, b);
      return;
    }
    var current = sortRun.queue[sortRun.idx];
    var word = current.word;

    $('#app').innerHTML =
      '<div class="top"><button class="back-btn">← Playroom</button></div>'+
      '<h2>🔀 Sound Sort · '+escapeHtml(a.name)+' + '+escapeHtml(b.name)+'</h2>'+
      '<div class="stat-row"><span>Sorted: <b>'+sortRun.idx+' / '+sortRun.queue.length+'</b></span></div>'+
      '<button class="prompt-card" id="soundSortPrompt">'+
        '<div class="sent-visual" style="display:flex;justify-content:center;margin-bottom:8px;">'+visualOrTextHtml(word)+'</div>'+
        '<div class="hanzi">'+escapeHtml(word.hanzi)+'</div>'+
        '<div class="pinyin">'+escapeHtml(word.pinyin)+'</div>'+
        '<div class="tap-hint">🔊 Tap to hear it again</div>'+
      '</button>'+
      '<div class="sort-buckets">'+
        '<button class="sort-bucket" data-id="'+a.id+'" style="--accent:var(--'+a.accent+')"><span class="b-icon">'+a.icon+'</span>'+escapeHtml(a.name)+'</button>'+
        '<button class="sort-bucket" data-id="'+b.id+'" style="--accent:var(--'+b.accent+')"><span class="b-icon">'+b.icon+'</span>'+escapeHtml(b.name)+'</button>'+
      '</div>';

    $('.back-btn', $('#app')).addEventListener('click', function(){ sortRun=null; go('home'); });
    $('#soundSortPrompt', $('#app')).addEventListener('click', function(){ speak(word.hanzi, 'zh-CN'); });
    speak(word.hanzi, 'zh-CN');

    $all('.sort-bucket', $('#app')).forEach(function(btn){
      btn.addEventListener('click', function(){
        var chosen = btn.getAttribute('data-id');
        if (chosen === current.subjectId){
          playCorrectSound();
          speak(word.hanzi + '，' + word.en, 'zh-CN');
          sortRun.idx += 1;
          setTimeout(function(){ renderSoundSort(); }, 850);
        } else {
          btn.classList.add('wrong');
          playWrongSound();
          setTimeout(function(){ btn.classList.remove('wrong'); }, 420);
        }
      });
    });
  }

  function renderSortCelebrate(a, b){
    $('#app').innerHTML =
      '<div class="top"><button class="back-btn">← Playroom</button></div>'+
      '<div class="celebrate">'+
        '<div class="big-emoji">🎉</div>'+
        '<h2>All sorted!</h2>'+
        '<p>You sorted '+escapeHtml(a.name)+' and '+escapeHtml(b.name)+' perfectly.</p>'+
        '<div class="stars-row">⭐⭐⭐</div>'+
        '<div class="btn-col">'+
          '<button class="btn primary" id="sortAgainBtn">Sort Again</button>'+
          '<button class="btn secondary" id="sortBackBtn">Back to Playroom</button>'+
        '</div>'+
      '</div>';
    $('.back-btn', $('#app')).addEventListener('click', function(){ sortRun=null; go('home'); });
    $('#sortAgainBtn', $('#app')).addEventListener('click', function(){ sortRun=null; renderSoundSort(); });
    $('#sortBackBtn', $('#app')).addEventListener('click', function(){ sortRun=null; go('home'); });
  }

  /* ============ SONGS ============ */
  function findSong(id){
    for (var i=0;i<SONGS.length;i++) if (SONGS[i].id === id) return SONGS[i];
    return null;
  }

  function renderSongs(){
    var tiles = SONGS.map(function(song){
      return (
        '<button class="song-tile" data-song="'+song.id+'" style="--accent:var(--'+song.accent+')">'+
          '<span class="icon">'+song.icon+'</span>'+
          '<div><div class="song-title">'+escapeHtml(song.title)+'</div>'+
          '<div class="song-hanzi">'+escapeHtml(song.titleHanzi)+'</div></div>'+
        '</button>'
      );
    }).join('');

    $('#app').innerHTML =
      '<div class="top"><button class="back-btn">← Playroom</button></div>'+
      '<h2>🎵 Songs</h2>'+
      '<div class="intro-line">Pick a song to sing along, line by line.</div>'+
      tiles;

    $('.back-btn', $('#app')).addEventListener('click', function(){ go('home'); });
    $all('.song-tile', $('#app')).forEach(function(btn){
      btn.addEventListener('click', function(){ go('songDetail', btn.getAttribute('data-song')); });
    });
  }

  function renderSongDetail(songId){
    var song = findSong(songId);
    if (!song){ go('songs'); return; }

    var linesHtml = song.lines.map(function(line, i){
      return (
        '<button class="song-line" data-i="'+i+'">'+
          '<div class="hanzi">'+escapeHtml(line.hanzi)+'</div>'+
          '<div class="pinyin">'+escapeHtml(line.pinyin)+'</div>'+
          '<div class="en">'+escapeHtml(line.en)+'</div>'+
        '</button>'
      );
    }).join('');

    $('#app').innerHTML =
      '<div class="top"><button class="back-btn">← Songs</button></div>'+
      '<h2>'+song.icon+' '+escapeHtml(song.title)+'</h2>'+
      '<div class="intro-line">Tap a line to hear it, or sing the whole song.</div>'+
      '<button class="sing-all-btn" id="singAllBtn" type="button">▶️ Sing the whole song</button>'+
      '<div>'+linesHtml+'</div>';

    $('.back-btn', $('#app')).addEventListener('click', function(){ go('songs'); });
    $all('.song-line', $('#app')).forEach(function(btn){
      btn.addEventListener('click', function(){
        var i = parseInt(btn.getAttribute('data-i'), 10);
        speak(song.lines[i].hanzi, 'zh-CN');
      });
    });
    $('#singAllBtn', $('#app')).addEventListener('click', function(){
      singSongLines(song.lines, 0);
    });
  }

  /* Reads each line aloud in turn, waiting for one line to finish before starting the next. */
  function singSongLines(lines, idx){
    if (idx >= lines.length) return;
    try{
      if (!('speechSynthesis' in window)){ return; }
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(lines[idx].hanzi);
      u.lang = 'zh-CN';
      u.rate = 0.9;
      u.onend = function(){ setTimeout(function(){ singSongLines(lines, idx+1); }, 350); };
      u.onerror = function(){ setTimeout(function(){ singSongLines(lines, idx+1); }, 350); };
      window.speechSynthesis.speak(u);
    }catch(e){ /* speech not available — fail silently */ }
  }

  /* ============ SENTENCES ============
     Everyday sentences from the class sheets (greetings, names, manners) plus the "I love to eat ..." sentences
     that are generated automatically from the Fruits, Vegetables and Food word lists.
     `parts` are the tiles used by the Build It game and must join back into `hanzi`.
  */
  var PHRASES = [
    { id:'hello',     group:'Greetings',     emoji:'👋', hanzi:'你好！',       pinyin:'Nǐ hǎo!',            en:'Hello!',                 parts:['你','好','！'] },
    { id:'hello-t',   group:'Greetings',     emoji:'🧑‍🏫', hanzi:'老师好！',     pinyin:'Lǎoshī hǎo!',        en:'Hello, teacher!',        parts:['老师','好','！'] },
    { id:'morning',   group:'Greetings',     emoji:'🌅', hanzi:'你早！',       pinyin:'Nǐ zǎo!',            en:'Good morning!',          parts:['你','早','！'] },
    { id:'morning-t', group:'Greetings',     emoji:'☀️', hanzi:'老师早！',     pinyin:'Lǎoshī zǎo!',        en:'Good morning, teacher!', parts:['老师','早','！'] },
    { id:'everyone',  group:'Greetings',     emoji:'🙌', hanzi:'大家好！',     pinyin:'Dàjiā hǎo!',         en:'Hello, everyone!',       parts:['大家','好','！'] },
    { id:'howru',     group:'Greetings',     emoji:'🤝', hanzi:'你好吗？',     pinyin:'Nǐ hǎo ma?',         en:'How are you?',           parts:['你','好吗','？'] },
    { id:'fine',      group:'Greetings',     emoji:'😄', hanzi:'我很好！',     pinyin:'Wǒ hěn hǎo!',        en:'I am very well!',        parts:['我','很','好','！'] },
    { id:'bye',       group:'Greetings',     emoji:'👋', hanzi:'再见！',       pinyin:'Zài jiàn!',          en:'Goodbye!',               parts:['再','见','！'] },
    { id:'name-q',    group:'Name and age',  emoji:'🏷️', hanzi:'你叫什么名字？', pinyin:'Nǐ jiào shénme míngzi?', en:'What is your name?',  parts:['你','叫','什么','名字','？'] },
    { id:'name-a',    group:'Name and age',  emoji:'🙋', hanzi:'我叫大卫。',   pinyin:'Wǒ jiào Dàwèi.',     en:'My name is David.',      parts:['我','叫','大卫','。'] },
    { id:'age-q',     group:'Name and age',  emoji:'🎂', hanzi:'你几岁？',     pinyin:'Nǐ jǐ suì?',         en:'How old are you?',       parts:['你','几','岁','？'] },
    { id:'age-a',     group:'Name and age',  emoji:'🖐️', hanzi:'我四岁。',     pinyin:'Wǒ sì suì.',         en:'I am four years old.',   parts:['我','四','岁','。'] },
    { id:'thanks',    group:'Good manners',  emoji:'🙏', hanzi:'谢谢你！',     pinyin:'Xièxie nǐ!',         en:'Thank you!',             parts:['谢谢','你','！'] },
    { id:'thanks2',   group:'Good manners',  emoji:'😊', hanzi:'谢谢！',       pinyin:'Xièxie!',            en:'Thanks!',                parts:['谢','谢','！'] },
    { id:'welcome',   group:'Good manners',  emoji:'🤗', hanzi:'不客气！',     pinyin:'Bú kèqi!',           en:'You are welcome!',       parts:['不','客气','！'] },
    { id:'sorry',     group:'Good manners',  emoji:'😔', hanzi:'对不起！',     pinyin:'Duìbuqǐ!',           en:'I am sorry!',            parts:['对','不','起','！'] },
    { id:'nevermind', group:'Good manners',  emoji:'👍', hanzi:'没关系！',     pinyin:'Méi guānxi!',        en:'Never mind! It is OK!',  parts:['没','关系','！'] },
    { id:'buying',    group:'From the song', emoji:'🛒', hanzi:'你买什么？',   pinyin:'Nǐ mǎi shénme?',     en:'What are you buying?',   parts:['你','买','什么','？'] }
  ];
  var SENT_MEM_KEY = 'mandarin-playroom-memorized-v1';
  function loadMemorized(){
    try{ var raw = window.localStorage.getItem(SENT_MEM_KEY); return raw ? JSON.parse(raw) : {}; }catch(e){ return {}; }
  }
  function saveMemorized(m){
    try{ window.localStorage.setItem(SENT_MEM_KEY, JSON.stringify(m)); }catch(e){ /* ignore */ }
  }
  function foodSentences(){
    var out = [];
    ['fruits','vegetables','food','drinks'].forEach(function(sid){
      var s = findSubject(sid); if (!s) return;
      s.words.forEach(function(w){
        var pre = s.sentence.zhPrefix;
        var parts = (pre.charAt(0) === '我') ? ['我', pre.slice(1), w.hanzi, '。'] : [pre, w.hanzi, '。'];
