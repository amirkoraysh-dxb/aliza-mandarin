<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aliza's Mandarin Playground</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #FFF6E5 0%, #FFE9EC 100%);
      --card-bg: #FFFFFF;
      --primary: #FF5A79;
      --primary-light: #FFE4E8;
      --secondary: #3B82F6;
      --secondary-light: #EBF5FF;
      --success: #10B981;
      --success-light: #ECFDF5;
      --border-color: #F1E5D8;
      --text-dark: #1F2937;
      --text-sub: #6B7280;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      background: var(--bg-gradient);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, sans-serif;
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      color: var(--primary);
      text-shadow: 0 2px 4px rgba(255, 90, 121, 0.15);
    }

    /* Category Topics */
    .topics-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
      max-width: 650px;
    }

    .topic-pill {
      background: #FFFFFF;
      border: 2px solid var(--border-color);
      border-radius: 30px;
      padding: 7px 16px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-dark);
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
      transition: all 0.2s ease;
    }

    .topic-pill:active { transform: scale(0.95); }

    .topic-pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
      box-shadow: 0 4px 10px rgba(255, 90, 121, 0.35);
      transform: scale(1.03);
    }

    /* Game Mode Switcher */
    .mode-container {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .mode-btn {
      background: #FFFFFF;
      border: 2px solid var(--secondary-light);
      color: var(--secondary);
      font-size: 14px;
      font-weight: 800;
      padding: 7px 16px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: var(--secondary);
      border-color: var(--secondary);
      color: #FFFFFF;
      box-shadow: 0 3px 8px rgba(59, 130, 246, 0.3);
    }

    /* Difficulty Toggles */
    .toggles-container {
      display: flex;
      gap: 16px;
      background: rgba(255, 255, 255, 0.7);
      padding: 8px 18px;
      border-radius: 20px;
      border: 1.5px solid #F0E3D5;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
      color: #4B5563;
      cursor: pointer;
    }

    .toggle-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    /* Audio Speaker Prompt in Listen Mode */
    #listenPromptBox {
      display: none;
      margin-bottom: 14px;
    }

    .speaker-bubble {
      background: var(--primary-light);
      border: 2px dashed var(--primary);
      color: var(--primary);
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(255, 90, 121, 0.15);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    /* Board Grid */
    #board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 620px;
      margin-bottom: 16px;
    }

    @media (max-width: 480px) {
      #board { gap: 8px; }
    }

    /* Cards */
    .card {
      aspect-ratio: 1 / 1.15;
      background: var(--card-bg);
      border-radius: 20px;
      border: 3px solid #F3EDE4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.05);
      position: relative;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.2s ease, background-color 0.2s ease;
      padding: 6px;
      text-align: center;
    }

    .card:active { transform: scale(0.94); }

    .card.backside {
      background: linear-gradient(135deg, #FFB2C3 0%, #FF7F9B 100%);
      border-color: #FFA5BA;
    }

    .card.backside::after {
      content: "🌸";
      font-size: 32px;
    }

    .card.matched {
      background: var(--success-light);
      border-color: var(--success);
      transform: scale(0.96);
      pointer-events: none;
      opacity: 0.9;
    }

    /* Typography inside Cards */
    .card-icon {
      font-size: 34px;
      line-height: 1;
      margin-bottom: 4px;
      transition: opacity 0.2s ease;
    }

    .card-hanzi {
      font-size: 32px;
      font-weight: 800;
      color: var(--text-dark);
      line-height: 1.15;
    }

    .card-pinyin {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-sub);
      margin-top: 3px;
    }

    .card-english {
      font-size: 14px;
      font-weight: 700;
      color: #4B5563;
      margin-top: 2px;
      transition: opacity 0.2s ease;
    }

    /* Utility classes triggered by checkboxes */
    body.hide-english .card-english {
      display: none !important;
    }

    body.hide-pictures .card-icon {
      display: none !important;
    }

    /* Win Banner */
    .win-modal {
      display: none;
      background: var(--success-light);
      border: 3px solid var(--success);
      color: #065F46;
      font-size: 20px;
      font-weight: 800;
      padding: 12px 24px;
      border-radius: 25px;
      text-align: center;
      margin-top: 8px;
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <header>
    <h1>🌸 Aliza's Mandarin Playground</h1>
  </header>

  <!-- Categories -->
  <div class="topics-container" id="topicList"></div>

  <!-- Modes -->
  <div class="mode-container">
    <button class="mode-btn active" id="btnMemory" onclick="switchMode('memory')">🃏 Memory Flip</button>
    <button class="mode-btn" id="btnListen" onclick="switchMode('listen')">🔊 Listen & Pop</button>
  </div>

  <!-- Difficulty Controls (Tick boxes) -->
  <div class="toggles-container">
    <label class="toggle-label">
      <input type="checkbox" id="toggleEnglish" checked onchange="toggleDifficulty()">
      <span>Show English</span>
    </label>
    <label class="toggle-label">
      <input type="checkbox" id="togglePictures" checked onchange="toggleDifficulty()">
      <span>Show Pictures</span>
    </label>
  </div>

  <!-- Audio Prompt for Listen Mode -->
  <div id="listenPromptBox">
    <div class="speaker-bubble" onclick="replayAudioPrompt()">
      <span>🔊 Tap to hear word again</span>
    </div>
  </div>

  <!-- Grid -->
  <div id="board"></div>

  <!-- Win Banner -->
  <div id="winBanner" class="win-modal">🎉 太棒了! (Well done, Aliza!) 🎉</div>

  <script>
    const LESSONS = {
      colors: {
        title: "🎨 Colors (颜色)",
        items: [
          { hanzi: "绿色", pinyin: "lǜ sè", en: "Green colour", icon: "🟢" },
          { hanzi: "红色", pinyin: "hóng sè", en: "Red colour", icon: "🔴" },
          { hanzi: "蓝色", pinyin: "lán sè", en: "Blue colour", icon: "🔵" },
          { hanzi: "黄色", pinyin: "huáng sè", en: "Yellow colour", icon: "🟡" }
        ]
      },
      animals: {
        title: "🐶 Animals (动物)",
        items: [
          { hanzi: "狗", pinyin: "gǒu", en: "Dog", icon: "🐶" },
          { hanzi: "猫", pinyin: "māo", en: "Cat", icon: "🐱" },
          { hanzi: "兔子", pinyin: "tù zi", en: "Rabbit", icon: "🐰" },
          { hanzi: "鸟", pinyin: "niǎo", en: "Bird", icon: "🐦" }
        ]
      },
      fruits: {
        title: "🍎 Fruits (水果)",
        items: [
          { hanzi: "苹果", pinyin: "píng guǒ", en: "Apple", icon: "🍎" },
          { hanzi: "香蕉", pinyin: "xiāng jiāo", en: "Banana", icon: "🍌" },
          { hanzi: "西瓜", pinyin: "xī guā", en: "Watermelon", icon: "🍉" },
          { hanzi: "草莓", pinyin: "cǎo méi", en: "Strawberry", icon: "🍓" }
        ]
      },
      numbers: {
        title: "🔢 Numbers (数字)",
        items: [
          { hanzi: "一", pinyin: "yī", en: "One (1)", icon: "1️⃣" },
          { hanzi: "二", pinyin: "èr", en: "Two (2)", icon: "2️⃣" },
          { hanzi: "三", pinyin: "sān", en: "Three (3)", icon: "3️⃣" },
          { hanzi: "四", pinyin: "sì", en: "Four (4)", icon: "4️⃣" }
        ]
      }
    };

    let currentTopic = 'colors';
    let currentMode = 'memory';
    let memoryFlipped = [];
    let isBoardLocked = false;
    let targetWord = null;

    function speakWord(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.8;
        utterance.pitch = 1.1;
        window.speechSynthesis.speak(utterance);
      }
    }

    function toggleDifficulty() {
      const showEn = document.getElementById('toggleEnglish').checked;
      const showPic = document.getElementById('togglePictures').checked;
      
      document.body.classList.toggle('hide-english', !showEn);
      document.body.classList.toggle('hide-pictures', !showPic);
    }

    function renderTopicList() {
      const container = document.getElementById('topicList');
      container.innerHTML = '';
      Object.keys(LESSONS).forEach(key => {
        const btn = document.createElement('button');
        btn.className = `topic-pill ${key === currentTopic ? 'active' : ''}`;
        btn.innerText = LESSONS[key].title;
        btn.onclick = () => {
          currentTopic = key;
          renderTopicList();
          initRound();
        };
        container.appendChild(btn);
      });
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('btnMemory').classList.toggle('active', mode === 'memory');
      document.getElementById('btnListen').classList.toggle('active', mode === 'listen');
      document.getElementById('listenPromptBox').style.display = mode === 'listen' ? 'block' : 'none';
      initRound();
    }

    function shuffleArray(arr) {
      return arr.slice().sort(() => Math.random() - 0.5);
    }

    function initRound() {
      const board = document.getElementById('board');
      const winBanner = document.getElementById('winBanner');
      board.innerHTML = '';
      winBanner.style.display = 'none';
      memoryFlipped = [];
      isBoardLocked = false;

      const words = LESSONS[currentTopic].items;

      if (currentMode === 'memory') {
        let deck = [];
        words.forEach((item, id) => {
          deck.push({ id, kind: 'zh', data: item });
          deck.push({ id, kind: 'en', data: item });
        });
        deck = shuffleArray(deck);

        deck.forEach(cardInfo => {
          const cardEl = document.createElement('div');
          cardEl.className = 'card backside';
          cardEl.dataset.id = cardInfo.id;

          cardEl.onclick = () => {
            if (isBoardLocked || cardEl.classList.contains('matched') || cardEl === memoryFlipped[0]?.el) return;

            cardEl.classList.remove('backside');
            if (cardInfo.kind === 'zh') {
              cardEl.innerHTML = `
                <div class="card-hanzi">${cardInfo.data.hanzi}</div>
                <div class="card-pinyin">${cardInfo.data.pinyin}</div>
              `;
            } else {
              cardEl.innerHTML = `
                <div class="card-icon">${cardInfo.data.icon}</div>
                <div class="card-english">${cardInfo.data.en}</div>
              `;
            }

            speakWord(cardInfo.data.hanzi);
            memoryFlipped.push({ el: cardEl, info: cardInfo });

            if (memoryFlipped.length === 2) {
              isBoardLocked = true;
              const [first, second] = memoryFlipped;

              if (first.info.id === second.info.id) {
                setTimeout(() => {
                  first.el.classList.add('matched');
                  second.el.classList.add('matched');
                  memoryFlipped = [];
                  isBoardLocked = false;
                  verifyVictory(words.length * 2);
                }, 400);
              } else {
                setTimeout(() => {
                  first.el.classList.add('backside');
                  second.el.classList.add('backside');
                  first.el.innerHTML = '';
                  second.el.innerHTML = '';
                  memoryFlipped = [];
                  isBoardLocked = false;
                }, 900);
              }
            }
          };

          board.appendChild(cardEl);
        });

      } else {
        targetWord = words[Math.floor(Math.random() * words.length)];
        setTimeout(() => speakWord(targetWord.hanzi), 350);

        shuffleArray(words).forEach(item => {
          const cardEl = document.createElement('div');
          cardEl.className = 'card';
          cardEl.innerHTML = `
            <div class="card-icon">${item.icon}</div>
            <div class="card-hanzi">${item.hanzi}</div>
            <div class="card-english">${item.en}</div>
          `;

          cardEl.onclick = () => {
            if (item.hanzi === targetWord.hanzi) {
              cardEl.classList.add('matched');
              speakWord("对了! " + item.hanzi);
              setTimeout(() => {
                winBanner.style.display = 'block';
                setTimeout(initRound, 1400);
              }, 400);
            } else {
              speakWord("不对哦");
              cardEl.style.borderColor = '#EF4444';
              setTimeout(() => cardEl.style.borderColor = '#F3EDE4', 600);
            }
          };

          board.appendChild(cardEl);
        });
      }
    }

    function replayAudioPrompt() {
      if (targetWord) speakWord(targetWord.hanzi);
    }

    function verifyVictory(expectedTotal) {
      const matched = document.querySelectorAll('.card.matched').length;
      if (matched === expectedTotal) {
        document.getElementById('winBanner').style.display = 'block';
      }
    }

    renderTopicList();
    initRound();
    toggleDifficulty();
  </script>
</body>
</html>
