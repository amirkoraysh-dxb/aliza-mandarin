<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mandarin Playroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#F0F7FF;
    --surface:#FFFFFF;
    --ink:#1F2A44;
    --ink-soft:#5B6889;
    --coral:#FF6B5B;
    --sun:#FFC145;
    --bamboo:#2FBF8F;
    --sky:#4C8DFF;
    --purple:#A78BFA;
    --shadow: 31,42,68;
    --card-back-a:#DCEBFF;
    --card-back-b:#C7DEFF;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0F1830;
      --surface:#182448;
      --ink:#EEF3FF;
      --ink-soft:#9FAFD4;
      --coral:#FF8A7C;
      --sun:#FFD873;
      --bamboo:#4CE0B3;
      --sky:#7AAEFF;
      --purple:#C6B7FF;
      --shadow: 3,6,16;
      --card-back-a:#233363;
      --card-back-b:#1B2850;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F1830;
    --surface:#182448;
    --ink:#EEF3FF;
    --ink-soft:#9FAFD4;
    --coral:#FF8A7C;
    --sun:#FFD873;
    --bamboo:#4CE0B3;
    --sky:#7AAEFF;
    --purple:#C6B7FF;
    --shadow: 3,6,16;
    --card-back-a:#233363;
    --card-back-b:#1B2850;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Quicksand', system-ui, sans-serif;
    padding:20px 16px 48px;
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
  }
  h1,h2,h3{ font-family:'Baloo 2', 'Quicksand', system-ui, sans-serif; text-wrap:balance; margin:0; }
  .hanzi{ font-family:'Noto Sans SC','Baloo 2',sans-serif; }
  button{ font-family:inherit; }
  a{ color:inherit; }
  .swatch{
    border:3px solid rgba(120,130,150,.28);
    display:inline-flex; align-items:center; justify-content:center; line-height:1;
  }

  .wrap{ max-width:900px; margin:0 auto; }

  /* ---------- header ---------- */
  .top{
    display:flex; align-items:center; gap:14px; margin-bottom:22px; flex-wrap:wrap;
  }
  .panda{ width:56px; height:56px; flex:none; filter: drop-shadow(0 3px 6px rgba(var(--shadow),0.15)); }
  .top h1{ font-size:clamp(24px,5vw,32px); color:var(--ink); }
  .top .tag{ color:var(--ink-soft); font-size:15px; font-weight:600; margin-top:2px; }
  .top-spacer{ flex:1; }
  .back-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--surface); color:var(--ink); border:none;
    padding:10px 16px; border-radius:999px; font-weight:700; font-size:15px;
    cursor:pointer; box-shadow:0 4px 0 rgba(var(--shadow),0.1);
    transition:transform .12s ease;
  }
  .back-btn:hover{ transform:translateY(-1px); }
  .back-btn:active{ transform:translateY(1px); }
  .back-btn:focus-visible, button:focus-visible, [tabindex]:focus-visible{
    outline:3px solid var(--sky); outline-offset:2px;
  }

  /* ---------- home: subject tiles ---------- */
  .tiles{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:18px; margin-bottom:20px;
  }
  .tile{
    --accent: var(--sky);
    background:var(--surface);
    border-radius:28px;
    padding:22px 20px 20px;
    text-align:left;
    border:none;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    box-shadow:0 10px 0 rgba(var(--shadow),0.08), 0 2px 14px rgba(var(--shadow),0.10);
    transition:transform .15s ease, box-shadow .15s ease;
    display:flex; flex-direction:column; gap:10px;
    color:var(--ink);
  }
  .tile:hover{ transform:translateY(-4px); }
  .tile:active{ transform:translateY(1px); box-shadow:0 4px 0 rgba(var(--shadow),0.08); }
  .tile::before{
    content:""; position:absolute; inset:0 auto auto 0; width:100%; height:8px;
    background:var(--accent);
  }
  .tile .icon{
    font-size:38px; width:64px; height:64px; border-radius:20px;
    background:color-mix(in srgb, var(--accent) 18%, transparent);
    display:flex; align-items:center; justify-content:center;
  }
  .tile h2{ font-size:21px; }
  .tile .preview{ font-size:22px; letter-spacing:2px; opacity:.9; min-height:28px; }
  .tile .stars{ margin-top:auto; font-size:16px; letter-spacing:2px; }

  .intro-line{ color:var(--ink-soft); font-size:16px; font-weight:600; margin:2px 0 20px; }

  /* ---------- sound sort banner (home) ---------- */
  .sound-sort-banner{
    display:flex; align-items:center; gap:16px; width:100%; text-align:left; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--purple), color-mix(in srgb, var(--purple) 65%, #000 14%));
    color:#fff; border-radius:24px; padding:20px 22px; margin-bottom:22px;
    box-shadow:0 8px 0 color-mix(in srgb, var(--purple) 55%, #000 25%);
    transition:transform .12s ease;
  }
  .sound-sort-banner:hover{ transform:translateY(-2px); }
  .sound-sort-banner:active{ transform:translateY(2px); }
  .sound-sort-banner .ss-icon{ font-size:38px; flex:none; }
  .sound-sort-banner .ss-title{ font-family:'Baloo 2',sans-serif; font-size:20px; font-weight:800; }
  .sound-sort-banner .ss-desc{ font-size:14px; opacity:.92; font-weight:600; }

  /* ---------- difficulty settings ---------- */
  .settings-panel{
    display:flex; gap:16px; flex-wrap:wrap; align-items:center;
    background:var(--surface); border-radius:16px; padding:12px 18px; margin:0 0 22px;
    box-shadow:0 3px 10px rgba(var(--shadow),0.08);
  }
  .settings-panel .set-label{ font-weight:800; color:var(--ink-soft); font-size:14px; }
  .settings-panel label{ display:inline-flex; align-items:center; gap:7px; font-weight:700; font-size:14px; cursor:pointer; }
  .settings-panel input[type="checkbox"]{ width:19px; height:19px; accent-color:var(--sky); cursor:pointer; }
  .fallback-label{
    font-family:'Quicksand', sans-serif; font-weight:800; color:var(--ink);
    text-align:center; line-height:1.15; padding:4px; overflow-wrap:break-word;
    font-size:clamp(12px,3.4vw,16px);
  }

  /* ---------- subject hub ---------- */
  .subject-head{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .subject-head .icon-badge{
    --accent: var(--sky);
    width:52px; height:52px; border-radius:16px; font-size:28px;
    background:color-mix(in srgb, var(--accent) 20%, transparent);
    display:flex; align-items:center; justify-content:center;
  }
  .subject-head h2{ font-size:26px; }

  .word-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; margin-bottom:24px;
  }
  .word-card{
    background:var(--surface); border-radius:20px; padding:14px 10px 12px; text-align:center;
    border:none; cursor:pointer; box-shadow:0 3px 10px rgba(var(--shadow),0.08);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    transition:transform .12s ease;
  }
  .word-card:hover{ transform:translateY(-2px); }
  .word-card:active{ transform:scale(.97); }
  .word-card .visual{ font-size:34px; line-height:1; margin-bottom:2px; }
  .word-card .swatch{ width:38px; height:38px; border-radius:50%; margin-bottom:2px; box-shadow: inset 0 -4px 8px rgba(0,0,0,.12); font-size:19px; }
  .word-card .visual-img{ width:34px; height:54px; margin-bottom:2px; }
  .word-card .hanzi{ font-size:22px; font-weight:700; }
  .word-card .pinyin{ font-size:13px; color:var(--ink-soft); font-weight:600; }
  .word-card .en{ font-size:12px; color:var(--ink-soft); }
  .word-card .speak-note{ font-size:16px; margin-top:2px; }

  .mode-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px; }
  .mode-btn{
    --accent: var(--coral);
    border:none; border-radius:24px; cursor:pointer; text-align:left;
    padding:20px 22px; color:#fff;
    background:linear-gradient(160deg, var(--accent), color-mix(in srgb, var(--accent) 65%, #000 12%));
    box-shadow:0 10px 0 color-mix(in srgb, var(--accent) 55%, #000 25%);
    display:flex; flex-direction:column; gap:6px;
    transition:transform .12s ease;
  }
  .mode-btn:hover{ transform:translateY(-3px); }
  .mode-btn:active{ transform:translateY(2px); box-shadow:0 5px 0 color-mix(in srgb, var(--accent) 55%, #000 25%); }
  .mode-btn .emo{ font-size:32px; }
  .mode-btn .title{ font-size:20px; font-weight:800; font-family:'Baloo 2',sans-serif; }
  .mode-btn .desc{ font-size:14px; opacity:.92; font-weight:600; }

  /* ---------- shared: progress dots + prompt card + choices ---------- */
  .progress-dots{ display:flex; gap:8px; margin:6px 0 20px; flex-wrap:wrap; }
  .progress-dots .dot{ width:14px; height:14px; border-radius:50%; background:color-mix(in srgb, var(--ink-soft) 30%, transparent); }
  .progress-dots .dot.done{ background:var(--bamboo); }
  .progress-dots .dot.current{ outline:3px solid var(--sky); outline-offset:2px; }

  .prompt-card{
    background:var(--surface); border-radius:28px; padding:34px 20px; text-align:center; margin-bottom:26px;
    box-shadow:0 3px 16px rgba(var(--shadow),0.10);
    cursor:pointer; border:none; width:100%; color:var(--ink);
  }
  .prompt-card .hanzi{ font-size:64px; font-weight:700; line-height:1; }
  .prompt-card .pinyin{ font-size:22px; color:var(--ink-soft); font-weight:700; margin-top:6px; }
  .prompt-card .tap-hint{ font-size:14px; color:var(--ink-soft); margin-top:10px; font-weight:600; }
  .blank-mark{ display:inline-block; min-width:64px; border-bottom:4px solid var(--ink-soft); margin:0 6px; }

  .choice-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:16px; }
  .choice-tile{
    background:var(--surface); border:4px solid transparent; border-radius:22px; padding:20px 10px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 3px 10px rgba(var(--shadow),0.08);
    transition:transform .1s ease, border-color .15s ease;
    aspect-ratio:1/1;
  }
  .choice-tile .visual{ font-size:44px; }
  .choice-tile .swatch{ width:48px; height:48px; border-radius:50%; box-shadow: inset 0 -5px 10px rgba(0,0,0,.14); font-size:24px; }
  .choice-tile .visual-img{ width:44px; height:70px; }
  .choice-tile:hover{ transform:translateY(-2px); }
  .choice-tile.correct{ border-color:var(--bamboo); animation: pop .5s ease; }
  .choice-tile.wrong{ animation: shake .4s ease; border-color:var(--coral); }

  @keyframes pop{ 0%{transform:scale(1);} 40%{transform:scale(1.12);} 100%{transform:scale(1);} }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }

  /* ---------- memory game ---------- */
  .memory-grid{ display:grid; gap:12px; grid-template-columns:repeat(var(--cols,4), 1fr); }
  .flip-card{ perspective:800px; aspect-ratio:1/1; }
  .flip-card button{
    width:100%; height:100%; border:none; background:none; cursor:pointer; padding:0;
    position:relative; transform-style:preserve-3d; transition:transform .45s cubic-bezier(.2,.9,.3,1.1);
  }
  .flip-card.is-open button, .flip-card.is-matched button{ transform:rotateY(180deg); }
  .flip-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:16px;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:2px;
    box-shadow:0 3px 10px rgba(var(--shadow),0.10);
  }
  .flip-front{
    background:repeating-linear-gradient(135deg, var(--card-back-a) 0 14px, var(--card-back-b) 14px 28px);
    font-size:26px;
  }
  .flip-back{ background:var(--surface); transform:rotateY(180deg); padding:6px; text-align:center; }
  .flip-back .visual{ font-size:clamp(22px,6vw,36px); }
  .flip-back .swatch{ width:60%; aspect-ratio:1/1; border-radius:50%; box-shadow: inset 0 -5px 10px rgba(0,0,0,.14); font-size:clamp(14px,5vw,22px); }
  .flip-back .visual-img{ width:48%; height:64%; }
  .flip-back .hanzi{ font-size:clamp(16px,4vw,24px); font-weight:700; }
  .flip-back .pinyin{ font-size:clamp(9px,2.4vw,12px); color:var(--ink-soft); font-weight:700; }
  .flip-back .fallback-label{ font-size:clamp(10px,2.8vw,14px); padding:2px; }
  .flip-card.is-matched .flip-back{ background:color-mix(in srgb, var(--bamboo) 22%, var(--surface)); }

  /* ---------- shared image chip ---------- */
  .visual-img{ display:inline-flex; align-items:flex-end; justify-content:center; }
  .visual-img img{ width:100%; height:100%; object-fit:contain; display:block; }

  .stat-row{ display:flex; gap:18px; margin-bottom:18px; flex-wrap:wrap; font-weight:700; color:var(--ink-soft); }
  .stat-row b{ color:var(--ink); }

  /* ---------- sentence builder ---------- */
  .sentence-prompt{
    background:var(--surface); border-radius:28px; padding:26px 20px; text-align:center; margin-bottom:22px;
    box-shadow:0 3px 16px rgba(var(--shadow),0.10);
  }
  .sentence-prompt .sent-visual{ margin-bottom:10px; display:flex; justify-content:center; }
  .sentence-prompt .sent-visual .visual-img{ width:64px; height:96px; }
  .sentence-prompt .sent-visual .visual{ font-size:56px; }
  .sentence-prompt .sent-visual .swatch{ width:64px; height:64px; font-size:30px; }
  .hear-btn{
    border:none; background:color-mix(in srgb, var(--sky) 16%, transparent); color:var(--ink);
    font-weight:800; border-radius:999px; padding:10px 20px; cursor:pointer; font-size:15px;
  }
  .assembly-row{ display:flex; gap:12px; justify-content:center; margin:18px 0; flex-wrap:wrap; }
  .assembly-slot{
    min-width:110px; min-height:56px; border-radius:16px;
    border:3px dashed color-mix(in srgb, var(--ink-soft) 45%, transparent);
    display:flex; align-items:center; justify-content:center; padding:8px 14px;
    font-weight:700; font-size:19px; color:var(--ink-soft);
    background:color-mix(in srgb, var(--surface) 60%, transparent); cursor:pointer;
  }
  .assembly-slot.filled{ border-style:solid; border-color:var(--sky); background:var(--surface); color:var(--ink); }
  .assembly-slot.wrong{ animation:shake .4s ease; border-color:var(--coral); }
  .assembly-slot.correct{ border-color:var(--bamboo); animation:pop .5s ease; }
  .tile-bank{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:8px; }
  .word-tile{
    border:none; border-radius:16px; padding:14px 20px; font-weight:800; font-size:19px; cursor:pointer;
    background:var(--surface); box-shadow:0 4px 0 rgba(var(--shadow),0.1); color:var(--ink);
    transition:transform .1s ease;
  }
  .word-tile:active{ transform:translateY(2px); }
  .word-tile.used{ visibility:hidden; }
  .sentence-caption{ text-align:center; color:var(--ink-soft); font-weight:700; margin-top:10px; min-height:20px; }

  /* ---------- picture bingo ---------- */
  .bingo-call-row{ display:flex; align-items:center; gap:14px; justify-content:space-between; margin-bottom:8px; flex-wrap:wrap; }
  .repeat-btn{
    border:none; background:var(--surface); color:var(--ink); font-weight:800; border-radius:999px;
    padding:10px 20px; cursor:pointer; box-shadow:0 4px 0 rgba(var(--shadow),0.1);
  }
  .bingo-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:14px; margin-top:6px; }
  .bingo-tile{
    background:var(--surface); border-radius:18px; padding:10px 6px; border:4px solid transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center; aspect-ratio:1/1;
    box-shadow:0 3px 10px rgba(var(--shadow),0.08); transition:transform .1s ease;
  }
  .bingo-tile .visual-img{ width:52px; height:76px; }
  .bingo-tile:hover{ transform:translateY(-2px); }
  .bingo-tile.marked{ border-color:var(--bamboo); background:color-mix(in srgb, var(--bamboo) 18%, var(--surface)); cursor:default; }
  .bingo-tile.wrong{ animation:shake .4s ease; border-color:var(--coral); }

  /* ---------- sound sort ---------- */
  .sort-buckets{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px; }
  .sort-bucket{
    --accent: var(--sky);
    border:none; border-radius:24px; padding:24px 12px; cursor:pointer; color:#fff; text-align:center;
    background:linear-gradient(160deg, var(--accent), color-mix(in srgb, var(--accent) 65%, #000 12%));
    box-shadow:0 8px 0 color-mix(in srgb, var(--accent) 55%, #000 25%);
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:18px;
    transition:transform .1s ease;
  }
  .sort-bucket:active{ transform:translateY(2px); }
  .sort-bucket .b-icon{ font-size:34px; display:block; margin-bottom:4px; }
  .sort-bucket.wrong{ animation:shake .4s ease; }
  @media (max-width:480px){ .sort-buckets{ grid-template-columns:1fr; } }

  .sort-picker-grid{ display:flex; gap:12px; flex-wrap:wrap; margin:16px 0 22px; }
  .sort-chip{
    border:3px solid transparent; border-radius:999px; padding:10px 18px; font-weight:800; cursor:pointer;
    background:var(--surface); color:var(--ink); box-shadow:0 3px 10px rgba(var(--shadow),0.08);
  }
  .sort-chip.selected{ border-color:var(--sky); background:color-mix(in srgb, var(--sky) 16%, var(--surface)); }

  /* ---------- completion overlay ---------- */
  .celebrate{
    background:var(--surface); border-radius:28px; padding:36px 26px; text-align:center;
    box-shadow:0 8px 30px rgba(var(--shadow),0.16); max-width:420px; margin:20px auto 0;
  }
  .celebrate .big-emoji{ font-size:56px; margin-bottom:6px; }
  .celebrate h2{ font-size:24px; margin-bottom:6px; }
  .celebrate p{ color:var(--ink-soft); font-weight:600; margin:0 0 20px; }
  .celebrate .stars-row{ font-size:34px; margin-bottom:22px; letter-spacing:4px; }
  .celebrate .btn-col{ display:flex; flex-direction:column; gap:10px; }
  .celebrate .btn{
    border:none; border-radius:16px; padding:14px; font-weight:800; font-size:15px; cursor:pointer;
    font-family:'Baloo 2',sans-serif;
  }
  .celebrate .btn.primary{ background:var(--bamboo); color:#0b3327; }
  .celebrate .btn.secondary{ background:color-mix(in srgb, var(--sky) 18%, transparent); color:var(--ink); }

  footer{ text-align:center; color:var(--ink-soft); font-size:13px; font-weight:600; margin-top:40px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }

  @media (max-width:480px){
    .choice-grid{ grid-template-columns:repeat(2,1fr); }
    .memory-grid{ --cols:3 !important; }
  }
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
  "use strict";

  /* ============ VOCABULARY DATA ============
     Add new subjects or words here (or ask Claude to add them from a class PDF).
     Each word needs: en, hanzi, pinyin, and a picture — either `img` (a real photo/illustration file),
     `emoji` (+ optional `swatch` behind it), or just `swatch` alone for plain colors.
     `sentence` on a subject defines the simple teaching sentence built from any of its words:
     zhPrefix + word.hanzi + zhSuffix, and enPrefix + word.en + enSuffix in English.
  */
  var SUBJECTS = [
    {
      id: 'animals', name: 'Animals', icon: '🐾', accent: 'bamboo',
      sentence: { zhPrefix:'这是', zhPrefixPinyin:'Zhè shì', zhSuffix:'。', enPrefix:'This is a ', enSuffix:'.' },
      words: [
        { en:'Dog', hanzi:'狗', pinyin:'gǒu', emoji:'🐶' },
        { en:'Cat', hanzi:'猫', pinyin:'māo', emoji:'🐱' },
        { en:'Bird', hanzi:'鸟', pinyin:'niǎo', emoji:'🐦' },
        { en:'Fish', hanzi:'鱼', pinyin:'yú', emoji:'🐟' },
        { en:'Rabbit', hanzi:'兔子', pinyin:'tùzi', emoji:'🐰' },
        { en:'Panda', hanzi:'熊猫', pinyin:'xióngmāo', emoji:'🐼' }
      ]
    },
    {
      id: 'colors', name: 'Colors', icon: '🎨', accent: 'sky',
      sentence: { zhPrefix:'这是', zhPrefixPinyin:'Zhè shì', zhSuffix:'。', enPrefix:'This is ', enSuffix:'.' },
      words: [
        { en:'Red', hanzi:'红色', pinyin:'hóngsè', swatch:'#FF6B5B', emoji:'❤️' },
        { en:'Yellow', hanzi:'黄色', pinyin:'huángsè', swatch:'#FFC145', emoji:'☀️' },
        { en:'Blue', hanzi:'蓝色', pinyin:'lánsè', swatch:'#4C8DFF', emoji:'🌊' },
        { en:'Green', hanzi:'绿色', pinyin:'lǜsè', swatch:'#2FBF8F', emoji:'🎄' },
        { en:'Orange', hanzi:'橙色', pinyin:'chéngsè', swatch:'#FF8A3D', emoji:'🍊' },
        { en:'Pink', hanzi:'粉色', pinyin:'fěnsè', swatch:'#FF8FB3', emoji:'🌸' },
        { en:'Purple', hanzi:'紫色', pinyin:'zǐsè', swatch:'#A78BFA', emoji:'🍇' },
        { en:'Black', hanzi:'黑色', pinyin:'hēisè', swatch:'#2B2B33', emoji:'🕶️' },
        { en:'White', hanzi:'白色', pinyin:'báisè', swatch:'#FFFFFF', emoji:'❄️' }
      ]
    },
    {
