        var en = sentenceEn(s, w); en = en.charAt(0).toUpperCase() + en.slice(1);
        out.push({
          id:'eat-' + sid + '-' + w.hanzi, group:(sid === 'drinks' ? 'I like to drink · ' : 'I love to eat · ') + s.name, emoji:w.emoji,
          hanzi:sentenceZh(s, w), pinyin:s.sentence.zhPrefixPinyin + ' ' + w.pinyin + '.', en:en, parts:parts
        });
      });
    });
    return out;
  }
  var sentScope = 'talk';
  function sentPool(){
    if (sentScope === 'eat') return foodSentences();
    if (sentScope === 'all') return PHRASES.concat(foodSentences());
    return PHRASES.slice();
  }
  function sentById(id){
    var all = PHRASES.concat(foodSentences());
    for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
    return null;
  }
  var sayRun = null, pickRun = null, buildRun = null;

  function renderSentences(){
    var pool = sentPool(), mem = loadMemorized();
    var known = pool.filter(function(p){ return mem[p.id]; }).length;
    var scopes = [['talk','💬 Everyday'], ['eat','🍽️ Food & drinks'], ['all','⭐ All']];
    var chips = scopes.map(function(sc){
      return '<button class="scope-chip' + (sentScope === sc[0] ? ' selected' : '') + '" data-scope="' + sc[0] + '">' + sc[1] + '</button>';
    }).join('');
    var lastGroup = null, list = '';
    pool.forEach(function(p){
      if (p.group !== lastGroup){ list += '<h3 class="sent-group">' + escapeHtml(p.group) + '</h3>'; lastGroup = p.group; }
      list += '<button class="sent-card" data-id="' + escapeHtml(p.id) + '">' +
        '<span class="sc-emoji">' + p.emoji + '</span>' +
        '<span class="sc-text"><span class="hanzi">' + escapeHtml(p.hanzi) + '</span>' +
        '<span class="pinyin">' + escapeHtml(p.pinyin) + '</span>' +
        '<span class="en">' + escapeHtml(p.en) + '</span></span>' +
        '<span class="sc-mark">' + (mem[p.id] ? '✅' : '🔊') + '</span></button>';
    });
    $('#app').innerHTML =
      '<div class="top"><button class="back-btn">← Playroom</button></div>' +
      '<h2>💬 Sentences</h2>' +
      '<div class="intro-line">Learn whole sentences by heart. Tap a sentence to hear it.</div>' +
      '<div class="scope-row">' + chips + '</div>' +
      '<div class="sent-progress">✅ Learned by heart: <b>' + known + ' / ' + pool.length + '</b></div>' +
      '<div class="mode-row">' +
        '<button class="mode-btn" data-sgame="say" style="--accent:var(--coral)"><span class="emo">🗣️</span><span class="title">Say It</span><span class="desc">See the picture, say it in Chinese, then check</span></button>' +
        '<button class="mode-btn" data-sgame="pick" style="--accent:var(--sky)"><span class="emo">👂</span><span class="title">Listen &amp; Pick</span><span class="desc">Hear a sentence, pick what it means</span></button>' +
        '<button class="mode-btn" data-sgame="build" style="--accent:var(--sun)"><span class="emo">🧱</span><span class="title">Build It</span><span class="desc">Put the words in the right order</span></button>' +
        '<button class="mode-btn" data-sgame="speech" style="--accent:var(--purple)"><span class="emo">🎤</span><span class="title">My Speech</span><span class="desc">Make and practise your own speech</span></button>' +
      '</div>' +
      '<div class="sent-list">' + list + '</div>';

    $('.back-btn', $('#app')).addEventListener('click', function(){ go('home'); });
    $all('.scope-chip', $('#app')).forEach(function(b){
      b.addEventListener('click', function(){ sentScope = b.getAttribute('data-scope'); renderSentences(); });
    });
    $all('.sent-card', $('#app')).forEach(function(b){
      b.addEventListener('click', function(){ var p = sentById(b.getAttribute('data-id')); if (p) speak(p.hanzi, 'zh-CN'); });
    });
    $all('[data-sgame]', $('#app')).forEach(function(b){
      b.addEventListener('click', function(){
        var g = b.getAttribute('data-sgame');
        if (g === 'say'){ sayRun = null; go('sentSay'); }
        else if (g === 'pick'){ pickRun = null; go('sentPick'); }
        else if (g === 'build'){ buildRun = null; go('sentBuild'); }
        else go('speech');
      });
    });
  }

  function renderSentCelebrate(title, replayView){
    $('#app').innerHTML =
      '<div class="top"><button class="back-btn">← Sentences</button></div>' +
      '<div class="celebrate"><div class="big-emoji">🎉</div><h2>Great job!</h2>' +
      '<p>You finished ' + escapeHtml(title) + '.</p><div class="stars-row">⭐⭐⭐</div>' +
      '<div class="btn-col"><button class="btn primary" id="sentAgain">Play Again</button>' +
      '<button class="btn secondary" id="sentBack">Back to Sentences</button></div></div>';
    $('.back-btn', $('#app')).addEventListener('click', function(){ go('sentences'); });
    $('#sentBack', $('#app')).addEventListener('click', function(){ go('sentences'); });
    $('#sentAgain', $('#app')).addEventListener('click', function(){
      sayRun = null; pickRun = null; buildRun = null; go(replayView);
    });
  }

  /* ---- Say It: picture + English first, then reveal the Chinese ---- */
  function renderSentSay(){
    if (!sayRun){
      var ids = shuffle(sentPool()).slice(0, 10).map(function(p){ return p.id; });
      sayRun = { queue: ids, total: ids.length, learned: 0, shown: false };
    }
    if (!sayRun.queue.length){ renderSentCelebrate('Say It', 'sentSay'); return; }
    var p = sentById(sayRun.queue[0]);
    var dots = '';
    for (var i = 0; i < sayRun.total; i++) dots += '<span class="dot' + (i < sayRun.learned ? ' done' : (i === sayRun.learned ? ' current' : '')) + '"></span>';
    var body;
    if (!sayRun.shown){
      body =
        '<div class="say-card"><div class="say-emoji">' + p.emoji + '</div>' +
        '<div class="say-en">' + escapeHtml(p.en) + '</div>' +
        '<div class="say-hint">How do you say this in Chinese? Say it out loud!</div></div>' +
        '<div class="say-actions"><button class="say-btn main" id="sayShow">👀 Show me</button></div>';
    } else {
      body =
        '<div class="say-card revealed"><div class="say-emoji">' + p.emoji + '</div>' +
        '<div class="say-hanzi">' + escapeHtml(p.hanzi) + '</div>' +
        '<div class="say-pinyin">' + escapeHtml(p.pinyin) + '</div>' +
        '<div class="say-en small">' + escapeHtml(p.en) + '</div>' +
        '<button class="hear-btn" id="sayHear">🔊 Hear it</button></div>' +
        '<div class="say-actions"><button class="say-btn again" id="sayAgain">🔁 Again</button>' +
        '<button class="say-btn main" id="sayGot">✅ I said it!</button></div>';
    }
    $('#app').innerHTML =
      '<div class="top"><button class="back-btn">← Sentences</button></div>' +
      '<h2>Say It</h2><div class="progress-dots">' + dots + '</div>' + body;
    $('.back-btn', $('#app')).addEventListener('click', function(){ sayRun = null; go('sentences'); });
    if (!sayRun.shown){
      $('#sayShow', $('#app')).addEventListener('click', function(){ sayRun.shown = true; renderSentSay(); });
    } else {
      speak(p.hanzi, 'zh-CN');
      $('#sayHear', $('#app')).addEventListener('click', function(){ speak(p.hanzi, 'zh-CN'); });
      $('#sayAgain', $('#app')).addEventListener('click', function(){
        sayRun.queue.push(sayRun.queue.shift()); sayRun.shown = false; renderSentSay();
      });
      $('#sayGot', $('#app')).addEventListener('click', function(){
        playCorrectSound();
        var m = loadMemorized(); m[p.id] = true; saveMemorized(m);
        sayRun.queue.shift(); sayRun.learned += 1; sayRun.shown = false; renderSentSay();
      });
    }
  }

  /* ---- Listen & Pick: hear the Chinese, choose the meaning ---- */
  function renderSentPick(){
    var pool = sentPool();
    if (!pickRun){
      pickRun = { ids: shuffle(pool).slice(0, 8).map(function(p){ return p.id; }), idx: 0, locked: false };
    }
    if (pickRun.idx >= pickRun.ids.length){ renderSentCelebrate('Listen & Pick', 'sentPick'); return; }
    var p = sentById(pickRun.ids[pickRun.idx]);
    var others = shuffle(pool.filter(function(o){ return o.id !== p.id && o.en !== p.en; })).slice(0, 2);
    var opts = shuffle([p].concat(others));
    var dots = '';
    for (var i = 0; i < pickRun.ids.length; i++) dots += '<span class="dot' + (i < pickRun.idx ? ' done' : (i === pickRun.idx ? ' current' : '')) + '"></span>';
    var choiceHtml = opts.map(function(o){
      return '<button class="pick-choice" data-id="' + escapeHtml(o.id) + '"><span class="pc-emoji">' + o.emoji + '</span><span>' + escapeHtml(o.en) + '</span></button>';
    }).join('');
    $('#app').innerHTML =
      '<div class="top"><button class="back-btn">← Sentences</button></div>' +
      '<h2>Listen &amp; Pick</h2><div class="progress-dots">' + dots + '</div>' +
      '<button class="say-card listen" id="pickHear"><div class="say-emoji">👂</div><div class="say-hint">Tap to hear the sentence</div></button>' +
      '<div class="pick-reveal" id="pickReveal"></div>' +
      '<div class="pick-choices">' + choiceHtml + '</div>';
    pickRun.locked = false;
    $('.back-btn', $('#app')).addEventListener('click', function(){ pickRun = null; go('sentences'); });
    $('#pickHear', $('#app')).addEventListener('click', function(){ speak(p.hanzi, 'zh-CN'); });
    setTimeout(function(){ if (pickRun && pickRun.ids[pickRun.idx] === p.id && document.getElementById('pickHear')) speak(p.hanzi, 'zh-CN'); }, 350);
    $all('.pick-choice', $('#app')).forEach(function(b){
      b.addEventListener('click', function(){
        if (pickRun.locked) return;
        if (b.getAttribute('data-id') === p.id){
          pickRun.locked = true;
          b.classList.add('right'); playCorrectSound();
          $('#pickReveal', $('#app')).innerHTML = '<span class="hanzi">' + escapeHtml(p.hanzi) + '</span> <span class="pinyin">' + escapeHtml(p.pinyin) + '</span>';
          setTimeout(function(){ pickRun.idx += 1; renderSentPick(); }, 1300);
        } else {
          b.classList.add('wrong'); playWrongSound();
        }
      });
    });
  }

  /* ---- Build It: tap the words in the right order ---- */
  function renderSentBuild(){
    var pool = sentPool();
    if (!buildRun){
      buildRun = { ids: shuffle(pool).slice(0, 6).map(function(p){ return p.id; }), idx: 0, placed: 0, used: null, done: false };
    }
    if (buildRun.idx >= buildRun.ids.length){ renderSentCelebrate('Build It', 'sentBuild'); return; }
    var p = sentById(buildRun.ids[buildRun.idx]);
    if (!buildRun.tiles || buildRun.tilesFor !== p.id){
      buildRun.tiles = shuffle(p.parts.map(function(t, i){ return { t:t, k:i }; }));
      buildRun.tilesFor = p.id; buildRun.placed = 0; buildRun.used = {}; buildRun.done = false;
    }
    var dots = '';
    for (var i = 0; i < buildRun.ids.length; i++) dots += '<span class="dot' + (i < buildRun.idx ? ' done' : (i === buildRun.idx ? ' current' : '')) + '"></span>';
    var slots = p.parts.map(function(t, i){
      return '<span class="sent-slot' + (i < buildRun.placed ? ' filled' : '') + '">' + (i < buildRun.placed ? escapeHtml(t) : '') + '</span>';
    }).join('');
    var tiles = buildRun.tiles.map(function(tile){
      return '<button class="sent-tile' + (buildRun.used[tile.k] ? ' used' : '') + '" data-k="' + tile.k + '">' + escapeHtml(tile.t) + '</button>';
    }).join('');
    $('#app').innerHTML =
      '<div class="top"><button class="back-btn">← Sentences</button></div>' +
      '<h2>Build It</h2><div class="progress-dots">' + dots + '</div>' +
      '<div class="say-card"><div class="say-emoji">' + p.emoji + '</div><div class="say-en">' + escapeHtml(p.en) + '</div>' +
      '<button class="hear-btn" id="buildHear">🔊 Hear it</button>' +
      '<div class="pick-reveal">' + (buildRun.done ? '<span class="pinyin">' + escapeHtml(p.pinyin) + '</span>' : '') + '</div></div>' +
      '<div class="sent-slots">' + slots + '</div>' +
      '<div class="sent-tiles">' + tiles + '</div>';
    $('.back-btn', $('#app')).addEventListener('click', function(){ buildRun = null; go('sentences'); });
    $('#buildHear', $('#app')).addEventListener('click', function(){ speak(p.hanzi, 'zh-CN'); });
    $all('.sent-tile', $('#app')).forEach(function(b){
      b.addEventListener('click', function(){
        if (buildRun.done) return;
        var k = parseInt(b.getAttribute('data-k'), 10);
        if (buildRun.used[k]) return;
        var tile = buildRun.tiles.filter(function(x){ return x.k === k; })[0];
        if (tile.t === p.parts[buildRun.placed]){
          buildRun.used[k] = true; buildRun.placed += 1;
          if (buildRun.placed >= p.parts.length){
            buildRun.done = true; playCorrectSound(); speak(p.hanzi, 'zh-CN');
            renderSentBuildNoReset();
            setTimeout(function(){ if (buildRun){ buildRun.idx += 1; buildRun.tilesFor = null; renderSentBuild(); } }, 1700);
          } else { renderSentBuildNoReset(); }
        } else {
          playWrongSound(); b.classList.add('wiggle');
          setTimeout(function(){ b.classList.remove('wiggle'); }, 400);
        }
      });
    });
  }
  function renderSentBuildNoReset(){ renderSentBuild(); }

  /* ---- My Speech: fill in the blanks from the class speech sheet ---- */
  var SPEECH_KEY = 'mandarin-playroom-speech-v1';
  var AGE_ZH = { '2':['二','èr'], '3':['三','sān'], '4':['四','sì'], '5':['五','wǔ'], '6':['六','liù'], '7':['七','qī'], '8':['八','bā'], '9':['九','jiǔ'], '10':['十','shí'] };
  function loadSpeech(){
    try{ var raw = window.localStorage.getItem(SPEECH_KEY); if (raw) return JSON.parse(raw); }catch(e){ /* ignore */ }
    return { name:'', age:'5', me:'', dad:'', mom:'', sis:'' };
  }
  function saveSpeech(d){ try{ window.localStorage.setItem(SPEECH_KEY, JSON.stringify(d)); }catch(e){ /* ignore */ } }
  function speechFoods(){
    var out = [];
    ['fruits','vegetables','food'].forEach(function(sid){
      var s = findSubject(sid); if (s) s.words.forEach(function(w){ out.push(w); });
    });
    return out;
  }
  function foodByHanzi(h){
    var all = speechFoods();
    for (var i = 0; i < all.length; i++) if (all[i].hanzi === h) return all[i];
    return null;
  }
  function speechLines(d){
    var nm = (d.name || '').trim(), age = AGE_ZH[d.age] || AGE_ZH['5'];
    var lines = [
      { emoji:'👋', hanzi:'大家好！', pinyin:'Dàjiā hǎo!', en:'Hello, everyone!' },
      { emoji:'🙋', hanzi:'我叫' + (nm || '＿＿＿') + '。', pinyin:'Wǒ jiào ' + (nm || '___') + '.', en:'My name is ' + (nm || '___') + '.' },
      { emoji:'🎂', hanzi:'我' + age[0] + '岁。', pinyin:'Wǒ ' + age[1] + ' suì.', en:'I am ' + d.age + ' years old.' }
    ];
    [['me','我爱吃','Wǒ ài chī','I love to eat ','😋'], ['dad','我爸爸爱吃','Wǒ bàba ài chī','My dad loves to eat ','👨'],
     ['mom','我妈妈爱吃','Wǒ māma ài chī','My mom loves to eat ','👩'], ['sis','我姐姐爱吃','Wǒ jiějie ài chī','My sister loves to eat ','👧']].forEach(function(r){
      var w = foodByHanzi(d[r[0]]);
      if (w) lines.push({ emoji:r[4], hanzi:r[1] + w.hanzi + '。', pinyin:r[2] + ' ' + w.pinyin + '.', en:r[3] + w.en.toLowerCase() + '.' });
    });
    lines.push({ emoji:'🙏', hanzi:'谢谢！', pinyin:'Xièxie!', en:'Thank you!' });
    return lines;
  }
  function renderSpeech(){
    var d = loadSpeech();
    var foodOpts = '<option value="">— skip —</option>' + speechFoods().map(function(w){
      return '<option value="' + escapeHtml(w.hanzi) + '">' + (w.emoji || '') + ' ' + escapeHtml(w.hanzi) + ' · ' + escapeHtml(w.en) + '</option>';
    }).join('');
    var ageOpts = Object.keys(AGE_ZH).map(function(a){ return '<option value="' + a + '">' + a + ' · ' + AGE_ZH[a][0] + '岁</option>'; }).join('');
    function foodSel(id, label){ return '<label>' + label + '<select id="sp_' + id + '">' + foodOpts + '</select></label>'; }
    $('#app').innerHTML =
      '<div class="top"><button class="back-btn">← Sentences</button></div>' +
      '<h2>🎤 My Speech</h2>' +
      '<div class="intro-line">Fill in the blanks, then practise your speech out loud.</div>' +
      '<div class="speech-form">' +
        '<label>My name is<input id="sp_name" type="text" maxlength="20" placeholder="type a name"></label>' +
        '<label>I am … years old<select id="sp_age">' + ageOpts + '</select></label>' +
        foodSel('me', 'I love to eat') + foodSel('dad', 'My dad loves to eat') +
        foodSel('mom', 'My mom loves to eat') + foodSel('sis', 'My sister loves to eat') +
      '</div>' +
      '<button class="sing-all-btn" id="speechAll" type="button">▶️ Read my whole speech</button>' +
      '<div id="speechLines"></div>';
    $('.back-btn', $('#app')).addEventListener('click', function(){ go('sentences'); });
    $('#sp_name', $('#app')).value = d.name || '';
    $('#sp_age', $('#app')).value = d.age || '5';
    ['me','dad','mom','sis'].forEach(function(k){ $('#sp_' + k, $('#app')).value = d[k] || ''; });
    function refresh(){
      d.name = $('#sp_name', $('#app')).value; d.age = $('#sp_age', $('#app')).value;
      ['me','dad','mom','sis'].forEach(function(k){ d[k] = $('#sp_' + k, $('#app')).value; });
      saveSpeech(d);
      var lines = speechLines(d);
      $('#speechLines', $('#app')).innerHTML = lines.map(function(l, i){
        return '<button class="song-line" data-i="' + i + '"><div class="hanzi">' + l.emoji + ' ' + escapeHtml(l.hanzi) + '</div>' +
          '<div class="pinyin">' + escapeHtml(l.pinyin) + '</div><div class="en">' + escapeHtml(l.en) + '</div></button>';
      }).join('');
      $all('#speechLines .song-line', $('#app')).forEach(function(b){
        b.addEventListener('click', function(){ speak(lines[parseInt(b.getAttribute('data-i'), 10)].hanzi, 'zh-CN'); });
      });
      return lines;
    }
    var current = refresh();
    ['sp_name','sp_age','sp_me','sp_dad','sp_mom','sp_sis'].forEach(function(id){
      var el = $('#' + id, $('#app'));
      el.addEventListener(id === 'sp_name' ? 'input' : 'change', function(){ current = refresh(); });
    });
    $('#speechAll', $('#app')).addEventListener('click', function(){ singSongLines(current, 0); });
  }

  /* ============ celebration screen (per-subject games) ============ */
  function renderCelebrate(s, mode){
    var labels = { match:'Match-Up', memory:'Memory', sentence:'Sentence Builder', fillblank:'Fill-in-the-Blank', bingo:'Picture Bingo' };
    var label = labels[mode] || mode;
    $('#app').innerHTML =
      '<div class="top"><button class="back-btn">← '+escapeHtml(s.name)+'</button></div>'+
      '<div class="celebrate">'+
        '<div class="big-emoji">🎉</div>'+
        '<h2>Great job!</h2>'+
        '<p>You finished '+label+' for '+escapeHtml(s.name)+'.</p>'+
        '<div class="stars-row">⭐⭐⭐</div>'+
        '<div class="btn-col">'+
          '<button class="btn primary" data-go="'+mode+'">Play Again</button>'+
          '<button class="btn secondary" data-go="subject">Back to '+escapeHtml(s.name)+'</button>'+
        '</div>'+
      '</div>';
    $('.back-btn', $('#app')).addEventListener('click', function(){ go('subject', s.id); });
    $all('[data-go]', $('#app')).forEach(function(btn){
      btn.addEventListener('click', function(){
        var target = btn.getAttribute('data-go');
        if (target === 'match') matchRun = null;
        if (target === 'memory') memRun = null;
        if (target === 'sentence') sbRun = null;
        if (target === 'fillblank') fbRun = null;
        if (target === 'bingo') bingoRun = null;
        go(target, s.id);
      });
    });
  }

  /* ============ router ============ */
  function renderApp(){
    if (STATE.view === 'subject') renderSubject(STATE.subjectId);
    else if (STATE.view === 'match') renderMatch(STATE.subjectId);
    else if (STATE.view === 'memory') renderMemory(STATE.subjectId);
    else if (STATE.view === 'sentence') renderSentenceBuilder(STATE.subjectId);
    else if (STATE.view === 'fillblank') renderFillBlank(STATE.subjectId);
    else if (STATE.view === 'bingo') renderBingo(STATE.subjectId);
    else if (STATE.view === 'write') renderWrite(STATE.subjectId);
    else if (STATE.view === 'sortPicker') renderSortPicker();
    else if (STATE.view === 'soundSort') renderSoundSort();
    else if (STATE.view === 'sentences') renderSentences();
    else if (STATE.view === 'sentSay') renderSentSay();
    else if (STATE.view === 'sentPick') renderSentPick();
    else if (STATE.view === 'sentBuild') renderSentBuild();
    else if (STATE.view === 'speech') renderSpeech();
    else if (STATE.view === 'songs') renderSongs();
    else if (STATE.view === 'songDetail') renderSongDetail(STATE.subjectId);
    else renderHome();
  }

  /* ============ hot-reload state carry (best effort) ============ */
  function persistHot(){
    try{
      if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function'){
        window.claude.hot.snapshot(function(){ return { view: STATE.view, subjectId: STATE.subjectId }; });
      }
    }catch(e){ /* ignore */ }
  }

  function boot(data){
    if (data && data.view){
      var gameViews = ['match','memory','sentence','fillblank','bingo','write','soundSort','sortPicker','sentSay','sentPick','sentBuild'];
      STATE.view = (gameViews.indexOf(data.view) !== -1) ? (data.subjectId ? 'subject' : 'home') : data.view;
      STATE.subjectId = data.subjectId || null;
      if (STATE.view === 'subject' && !findSubject(STATE.subjectId)) STATE.view = 'home';
    }
    renderApp();
    persistHot();
  }

  try{
    if (window.claude && window.claude.hot && window.claude.hot.ready){
      window.claude.hot.ready(boot);
    } else {
      boot(window.claude && window.claude.hot ? window.claude.hot.data : null);
    }
  }catch(e){ boot(null); }
})();
</script>
